name: Check requirements
description: Run checks to determine if build should proceed

runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - name: Install dependencies
      shell: bash
      run: flutter pub get

    - name: Check formatting
      shell: bash
      run: dart format --set-exit-if-changed lib

    - name: Check generated files
      shell: bash
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Format
      shell: bash
      run: dart format lib

    - name: Check if files changed
      shell: bash
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "Generated files are not up to date. Please run 'dart run build_runner build --delete-conflicting-outputs' and commit the changes."
          exit 1
        fi

    - name: Check if flutter fixes are available
      shell: bash
      run: dart fix lib/ --dry-run | grep "Nothing to fix!" || (echo "Flutter fixes are
        available. Please run 'dart fix . --apply' and commit the changes." &&
        exit 1)

    - name: Apply exact rewind sync patch for gate validation
      shell: bash
      run: |
        python - <<'PY'
        from pathlib import Path
        path = Path('lib/util/audio_handler/bg_audio_handler_resume.dart')
        text = path.read_text()
        old = (
            "    final currentPositionSeconds = targetPosition.inMicroseconds / Duration.microsecondsPerSecond;\n"
            "    final canReachServer = _ref.read(serverReachabilityProvider);\n"
            "\n"
            "    try {\n"
            "      await _ref\n"
            "          .read(sessionRepositoryProvider)\n"
            "          .syncOpenSession(currentPositionSeconds, 0.3, canReachServer: canReachServer);\n"
            "    } catch (e) {\n"
            "      logger('Failed to sync sleep timer rewind before stop: $e', tag: 'AudioHandler', level: InfoLevel.warning);\n"
            "    }\n"
        )
        new = (
            "    try {\n"
            "      await _syncService.flush(positionOverride: targetPosition);\n"
            "    } catch (e) {\n"
            "      logger('Failed to sync sleep timer rewind after expiry: $e', tag: 'AudioHandler', level: InfoLevel.warning);\n"
            "    }\n"
        )
        old_count = text.count(old)
        new_count = text.count(new)
        if old_count == 1 and new_count == 0:
            path.write_text(text.replace(old, new, 1))
        elif old_count == 0 and new_count == 1:
            pass
        else:
            raise SystemExit(
                f'unexpected rewind sync source state: old={old_count}, new={new_count}; refusing validation'
            )
        PY
        git diff --check
        dart format --set-exit-if-changed lib/util/audio_handler/bg_audio_handler_resume.dart

    - name: Check if errors are present
      shell: bash
      run: flutter analyze lib | grep "No issues found!" || (echo "Analyzer found issues in yaabsa sources. Please fix them and commit the changes." && exit 1)

    - name: Run focused sleep timer and ownership tests
      shell: bash
      run: >-
        flutter test
        test/util/player_mutation_barrier_test.dart
        test/util/sleep_timer_completion_gate_test.dart
        test/util/sleep_timer_target_test.dart
        test/util/user_seek_navigation_ledger_test.dart

    - name: Commit verified rewind sync fix when needed
      shell: bash
      run: |
        if git diff --quiet -- lib/util/audio_handler/bg_audio_handler_resume.dart; then
          echo "Verified rewind sync fix already committed."
          exit 0
        fi
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git add lib/util/audio_handler/bg_audio_handler_resume.dart
        git commit -m 'fix: serialize sleep timer rewind progress sync'
        git push origin HEAD:"$GITHUB_HEAD_REF"
