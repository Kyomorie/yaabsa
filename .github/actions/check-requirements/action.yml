name: Check requirements
description: Diagnostic formatter check for app update notifier

runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - name: Install dependencies
      shell: bash
      run: flutter pub get

    - name: Show formatter diff
      shell: bash
      run: |
        dart format lib
        echo '=== FORMATTER DIFF ==='
        git diff -- lib/util/app_update_checker.dart
        if [[ -n "$(git diff -- lib/util/app_update_checker.dart)" ]]; then
          exit 1
        fi
