name: Check requirements
description: Temporary V4 validation checks with generated-diff diagnostics

runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - name: Install dependencies
      shell: bash
      run: flutter pub get

    - name: Check formatting
      shell: bash
      run: dart format --set-exit-if-changed lib

    - name: Check generated files
      shell: bash
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Format generated files
      shell: bash
      run: dart format lib

    - name: Diagnose generated diff
      id: generated_diff
      shell: bash
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "dirty=true" >> "$GITHUB_OUTPUT"
          echo "--- git status --short ---"
          git status --short
          echo "--- git diff --stat ---"
          git diff --stat
          echo "--- git diff --numstat ---"
          git diff --numstat
          echo "--- generated diff ---"
          git diff -- '*.g.dart'
        else
          echo "dirty=false" >> "$GITHUB_OUTPUT"
          echo "Generated files are up to date."
        fi

    - name: Check if flutter fixes are available
      shell: bash
      run: dart fix lib/ --dry-run | grep "Nothing to fix!" || (echo "Flutter fixes are available. Please run 'dart fix . --apply' and commit the changes." && exit 1)

    - name: Check if errors are present
      shell: bash
      run: flutter analyze lib | grep "No issues found!" || (echo "Analyzer found issues in yaabsa sources. Please fix them and commit the changes." && exit 1)

    - name: Run chapter sleep coordination tests
      shell: bash
      run: flutter test test/util/chapter_sleep_timer_coordination_test.dart

    - name: Enforce generated consistency
      if: ${{ steps.generated_diff.outputs.dirty == 'true' }}
      shell: bash
      run: |
        echo "Generated files are not up to date. See diagnostic diff above."
        exit 1
