name: Check requirements
description: Targeted app update notifier tests

runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - name: Install dependencies
      shell: bash
      run: flutter pub get

    - name: Run app update notifier tests
      shell: bash
      run: flutter test test/util/app_update_checker_test.dart test/util/app_update_state_test.dart test/components/common/app_update_notifier_test.dart
