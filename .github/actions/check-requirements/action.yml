name: Check requirements
description: Temporary V4 validation checks with full diagnostics

runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - name: Install dependencies
      shell: bash
      run: flutter pub get

    - name: Check formatting
      shell: bash
      run: dart format --set-exit-if-changed lib

    - name: Check generated files
      shell: bash
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Format generated files
      shell: bash
      run: dart format lib

    - name: Diagnose generated diff
      id: generated_diff
      shell: bash
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "dirty=true" >> "$GITHUB_OUTPUT"
          echo "--- git status --short ---"
          git status --short
          echo "--- git diff --stat ---"
          git diff --stat
          echo "--- git diff --numstat ---"
          git diff --numstat
          echo "--- generated diff ---"
          git diff -- '*.g.dart'
        else
          echo "dirty=false" >> "$GITHUB_OUTPUT"
          echo "Generated files are up to date."
        fi

    - name: Diagnose available Dart fixes
      id: dart_fix
      shell: bash
      run: |
        output="$(dart fix lib/ --dry-run 2>&1)"
        printf '%s\n' "$output"
        if printf '%s\n' "$output" | grep -q "Nothing to fix!"; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Analyze sources
      id: analyze
      shell: bash
      run: |
        if flutter analyze lib; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Run chapter sleep coordination tests
      id: chapter_tests
      shell: bash
      run: |
        if flutter test test/util/chapter_sleep_timer_coordination_test.dart; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Enforce validation result
      shell: bash
      run: |
        failed=0
        if [[ "${{ steps.generated_diff.outputs.dirty }}" == "true" ]]; then
          echo "Generated files are not up to date."
          failed=1
        fi
        if [[ "${{ steps.dart_fix.outputs.ok }}" != "true" ]]; then
          echo "Dart fixes are available."
          failed=1
        fi
        if [[ "${{ steps.analyze.outputs.ok }}" != "true" ]]; then
          echo "Analyzer reported issues."
          failed=1
        fi
        if [[ "${{ steps.chapter_tests.outputs.ok }}" != "true" ]]; then
          echo "Chapter sleep coordination tests failed."
          failed=1
        fi
        exit "$failed"
