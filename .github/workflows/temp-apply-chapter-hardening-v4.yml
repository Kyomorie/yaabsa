name: Temporary apply chapter sleep hardening v4

on:
  push:
    branches:
      - feat/chapter-end-sleep-timer

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/chapter-end-sleep-timer
          fetch-depth: 0
          submodules: recursive

      - name: Apply corrected v3 hardening script
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import textwrap

          workflow = subprocess.check_output(
              [
                  'git',
                  'show',
                  '404210fcb2077933066e8bd2f9c1b31255e41f43:.github/workflows/temp-apply-chapter-hardening-v3.yml',
              ],
              text=True,
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = '          PY\n'
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])

          original = '''def replace_once(path, old, new, label):
    p = Path(path)
    text = p.read_text()
    count = text.count(old)
    if count != 1:
        raise SystemExit(f'{label}: expected one match, found {count}')
    p.write_text(text.replace(old, new, 1))
'''
          corrected = '''def replace_once(path, old, new, label):
    p = Path(path)
    text = p.read_text()
    count = text.count(old)
    sequential_labels = {
        'fast-forward lifecycle',
        'next-chapter lifecycle',
        'previous-chapter lifecycle',
    }
    if label in sequential_labels:
        if count < 1:
            raise SystemExit(f'{label}: expected at least one match, found {count}')
    elif count != 1:
        raise SystemExit(f'{label}: expected one match, found {count}')
    p.write_text(text.replace(old, new, 1))
'''
          if script.count(original) != 1:
              raise SystemExit('could not locate v3 replace_once helper')
          script = script.replace(original, corrected, 1)
          exec(compile(script, '<chapter-hardening-v3-corrected>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format touched Dart files
        run: |
          dart format \
            lib/util/audio_handler/bg_audio_handler.dart \
            lib/util/audio_handler/bg_audio_handler_models.dart \
            lib/util/audio_handler/bg_audio_handler_resume.dart \
            lib/util/handler/sleep_timer_handler.dart \
            lib/util/handler/sleep_timer_target.dart \
            lib/util/setting_key.dart \
            test/util/sleep_timer_target_test.dart

      - name: Check diff whitespace
        run: git diff --check

      - name: Analyze sources
        run: flutter analyze lib

      - name: Run chapter target tests
        run: flutter test test/util/sleep_timer_target_test.dart

      - name: Commit hardened implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/util/audio_handler/bg_audio_handler.dart \
            lib/util/audio_handler/bg_audio_handler_models.dart \
            lib/util/audio_handler/bg_audio_handler_resume.dart \
            lib/util/handler/sleep_timer_handler.dart \
            lib/util/handler/sleep_timer_target.dart \
            lib/util/setting_key.dart \
            test/util/sleep_timer_target_test.dart
          git commit -m "Harden chapter sleep timer navigation races"
          git push origin HEAD:feat/chapter-end-sleep-timer
