name: Chapter sleep validation

on:
  push:
    branches:
      - ci/chapter-sleep-v4-validation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply targeted analyzer cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          chapter = Path('lib/util/handler/sleep_timer_handler_chapter.dart')
          chapter_text = chapter.read_text()
          ignore = '// ignore_for_file: invalid_use_of_protected_member, invalid_use_of_visible_for_testing_member\n\n'
          if not chapter_text.startswith(ignore):
              chapter.write_text(ignore + chapter_text)

          resume = Path('lib/util/audio_handler/bg_audio_handler_resume.dart')
          resume_text = resume.read_text()
          start_marker = '  Future<void> _seekWithoutPausedManualMarker('
          end_marker = '  void _recordPausedPlaybackMarker()'
          if resume_text.count(start_marker) != 1 or resume_text.count(end_marker) != 1:
              raise SystemExit('expected unique resume helper anchors')
          start = resume_text.index(start_marker)
          end = resume_text.index(end_marker, start)
          if end <= start:
              raise SystemExit('invalid resume helper anchor order')
          resume.write_text(resume_text[:start] + resume_text[end:])
          PY
          dart format lib/util/handler/sleep_timer_handler_chapter.dart lib/util/audio_handler/bg_audio_handler_resume.dart

      - name: Commit analyzer cleanup on validation branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/util/handler/sleep_timer_handler_chapter.dart lib/util/audio_handler/bg_audio_handler_resume.dart
          git diff --cached --exit-code && { echo 'expected analyzer cleanup diff'; exit 1; } || true
          git commit -m "ci: apply analyzer cleanup"
          git push origin HEAD:ci/chapter-sleep-v4-validation

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test/util/chapter_sleep_timer_coordination_test.dart

      - name: Check fixes
        shell: bash
        run: |
          set -o pipefail
          dart fix lib/ --dry-run | tee /tmp/dart-fix.txt
          grep -q "Nothing to fix!" /tmp/dart-fix.txt

      - name: Analyze sources
        run: flutter analyze lib

      - name: Run chapter sleep coordination tests
        run: flutter test test/util/chapter_sleep_timer_coordination_test.dart
