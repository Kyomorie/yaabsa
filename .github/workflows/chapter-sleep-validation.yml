name: Chapter sleep validation

on:
  push:
    branches:
      - ci/chapter-sleep-v4-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test/util/chapter_sleep_timer_coordination_test.dart

      - name: Run build runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Show generated-tree delta
        shell: bash
        run: |
          echo '--- git status --short ---'
          git status --short
          echo '--- git diff --name-status ---'
          git diff --name-status
          echo '--- git diff --stat ---'
          git diff --stat

      - name: Check fixes
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          dart fix lib/ --dry-run | tee /tmp/dart-fix.txt
          grep -q "Nothing to fix!" /tmp/dart-fix.txt

      - name: Analyze sources
        continue-on-error: true
        run: flutter analyze lib

      - name: Run chapter sleep coordination tests
        continue-on-error: true
        run: flutter test test/util/chapter_sleep_timer_coordination_test.dart
