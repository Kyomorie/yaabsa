name: Chapter sleep validation

on:
  push:
    branches:
      - ci/chapter-sleep-v4-validation

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'ci: apply dart format'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply formatting
        run: dart format lib test/util/chapter_sleep_timer_coordination_test.dart

      - name: Capture formatter output on validation branch
        shell: bash
        run: |
          if ! git diff --quiet -- lib test/util/chapter_sleep_timer_coordination_test.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test/util/chapter_sleep_timer_coordination_test.dart
            git commit -m "ci: apply dart format"
            git push origin HEAD:ci/chapter-sleep-v4-validation
          fi

      - name: Check generated files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated tree clean
        run: git diff --exit-code

      - name: Check fixes
        shell: bash
        run: |
          set -o pipefail
          dart fix lib/ --dry-run | tee /tmp/dart-fix.txt
          grep -q "Nothing to fix!" /tmp/dart-fix.txt

      - name: Analyze sources
        run: flutter analyze lib

      - name: Run chapter sleep coordination tests
        run: flutter test test/util/chapter_sleep_timer_coordination_test.dart
