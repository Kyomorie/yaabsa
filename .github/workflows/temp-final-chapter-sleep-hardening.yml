name: Temporary final chapter sleep hardening

on:
  push:
    branches:
      - feat/chapter-end-sleep-timer

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/chapter-end-sleep-timer
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply final chapter sleep race hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          def lines(*items):
              return '\n'.join(items) + '\n'

          sleep = 'lib/util/handler/sleep_timer_handler.dart'
          replace_once(
              sleep,
              lines('  StreamSubscription<Duration>? _positionSubscription;', '  StreamSubscription<UserSeekNavigationEvent>? _userSeekNavigationSubscription;'),
              lines('  StreamSubscription<Duration>? _positionSubscription;', '  StreamSubscription<UserSeekNavigationEvent>? _userSeekNavigationSubscription;', '  StreamSubscription<bool>? _castControlSubscription;'),
              'cast subscription field',
          )
          replace_once(
              sleep,
              lines('    _attachPositionListener();', '    _attachUserSeekNavigationListener();'),
              lines('    _attachPositionListener();', '    _attachUserSeekNavigationListener();', '    _attachCastControlListener();'),
              'cast listener attach',
          )
          replace_once(
              sleep,
              lines('      _userSeekNavigationSubscription?.cancel();', '      _userSeekNavigationSubscription = null;'),
              lines('      _userSeekNavigationSubscription?.cancel();', '      _userSeekNavigationSubscription = null;', '      _castControlSubscription?.cancel();', '      _castControlSubscription = null;'),
              'cast listener dispose',
          )
          cast_methods = lines(
              '  void _attachCastControlListener() {',
              '    try {',
              '      _castControlSubscription = audioHandler.castControlActiveStream.listen(_handleCastControlChanged);',
              '    } catch (e) {',
              "      logger('Failed to attach sleep timer Cast listener: $e', tag: 'SleepTimer', level: InfoLevel.warning);",
              '    }',
              '  }',
              '',
              '  void _handleCastControlChanged(bool isActive) {',
              '    if (isActive && state.isActive && state.mode == SleepTimerMode.chapterEnd) {',
              "      _cancelChapterTimerForContextChange('Cast control became active');",
              '    }',
              '  }',
              '',
          )
          replace_once(
              sleep,
              '  void _handlePlayerStateChanged(PlayerState playerState) {\n',
              cast_methods + '  void _handlePlayerStateChanged(PlayerState playerState) {\n',
              'cast listener methods',
          )

          audio = 'lib/util/audio_handler/bg_audio_handler.dart'
          replace_once(
              audio,
              lines('  int _userSeekNavigationSequence = 0;', '  bool _chapterNotificationEnabled = false;'),
              lines('  int _userSeekNavigationSequence = 0;', '  final Set<int> _activeUserSeekNavigationOperations = <int>{};', '  bool _chapterNotificationEnabled = false;'),
              'active user navigation set',
          )
          old_lifecycle = lines(
              '  int _beginUserSeekNavigation() {',
              '    final operationId = ++_userSeekNavigationSequence;',
              '    if (!_userSeekNavigationController.isClosed) {',
              '      _userSeekNavigationController.add(',
              '        UserSeekNavigationEvent(operationId: operationId, phase: UserSeekNavigationPhase.began),',
              '      );',
              '    }',
              '    return operationId;',
              '  }',
              '',
              '  void _settleUserSeekNavigation(int operationId, {required bool shouldRetarget}) {',
              '    if (!_userSeekNavigationController.isClosed) {',
              '      _userSeekNavigationController.add(',
              '        UserSeekNavigationEvent(',
              '          operationId: operationId,',
              '          phase: UserSeekNavigationPhase.settled,',
              '          shouldRetarget: shouldRetarget,',
              '        ),',
              '      );',
              '    }',
              '  }',
          )
          new_lifecycle = lines(
              '  int _beginUserSeekNavigation() {',
              '    final operationId = ++_userSeekNavigationSequence;',
              '    _activeUserSeekNavigationOperations.add(operationId);',
              '    if (!_userSeekNavigationController.isClosed) {',
              '      _userSeekNavigationController.add(',
              '        UserSeekNavigationEvent(operationId: operationId, phase: UserSeekNavigationPhase.began),',
              '      );',
              '    }',
              '    return operationId;',
              '  }',
              '',
              '  void _settleUserSeekNavigation(int operationId, {required bool shouldRetarget}) {',
              '    try {',
              '      if (!_userSeekNavigationController.isClosed) {',
              '        _userSeekNavigationController.add(',
              '          UserSeekNavigationEvent(',
              '            operationId: operationId,',
              '            phase: UserSeekNavigationPhase.settled,',
              '            shouldRetarget: shouldRetarget,',
              '          ),',
              '        );',
              '      }',
              '    } finally {',
              '      _activeUserSeekNavigationOperations.remove(operationId);',
              '    }',
              '  }',
          )
          replace_once(audio, old_lifecycle, new_lifecycle, 'user navigation lifecycle tracking')

          old_queue = lines(
              '      if (queueList.isNotEmpty) {',
              '        _forceQueueSwitchOnNextPlay = true;',
              '        _ignoreProgressOnNextPlay = isLoopOn;',
              '        await play();',
              '      } else {',
          )
          new_queue = lines(
              '      if (queueList.isNotEmpty) {',
              '        final operationId = _beginUserSeekNavigation();',
              '        var navigationSucceeded = false;',
              '        try {',
              '          _forceQueueSwitchOnNextPlay = true;',
              '          _ignoreProgressOnNextPlay = isLoopOn;',
              '          await play();',
              '          navigationSucceeded = true;',
              '        } finally {',
              '          _settleUserSeekNavigation(operationId, shouldRetarget: navigationSucceeded);',
              '        }',
              '      } else {',
          )
          replace_once(audio, old_queue, new_queue, 'queue skip navigation lifecycle')

          old_completion = lines(
              '        if (suppressAutoAdvanceForSleepTimer) {',
              '          logger(',
              "            'Suppressing queue auto-advance because the sleep timer targets media completion',",
              "            tag: 'AudioHandler',",
              '            level: InfoLevel.info,',
              '          );',
              '          await pause();',
              '        } else {',
          )
          new_completion = lines(
              '        if (suppressAutoAdvanceForSleepTimer) {',
              '          logger(',
              "            'Suppressing queue auto-advance because the sleep timer targets media completion',",
              "            tag: 'AudioHandler',",
              '            level: InfoLevel.info,',
              '          );',
              '          final completionStillCurrent =',
              '              _activeUserSeekNavigationOperations.isEmpty &&',
              '              identical(_currentMediaItem, finishedMedia) &&',
              '              _player.playerState.processingState == ProcessingState.completed;',
              '          if (completionStillCurrent) {',
              '            await pause();',
              '          } else {',
              '            logger(',
              "              'Skipping sleep-timer completion pause because playback context changed',",
              "              tag: 'AudioHandler',",
              '              level: InfoLevel.debug,',
              '            );',
              '          }',
              '        } else {',
          )
          replace_once(audio, old_completion, new_completion, 'stale completion pause guard')
          PY

      - name: Format and regenerate only the sleep timer provider
        run: |
          dart format lib/util/audio_handler/bg_audio_handler.dart lib/util/handler/sleep_timer_handler.dart
          dart run build_runner build --build-filter=lib/util/handler/sleep_timer_handler.g.dart
          dart format lib/util/handler/sleep_timer_handler.g.dart
          git diff --check

      - name: Validate diff scope
        shell: bash
        run: |
          mapfile -t CHANGED < <(git diff --name-only)
          printf 'Changed files after hardening:\n'
          printf '  %s\n' "${CHANGED[@]}"
          for file in "${CHANGED[@]}"; do
            case "$file" in
              lib/util/audio_handler/bg_audio_handler.dart|lib/util/handler/sleep_timer_handler.dart|lib/util/handler/sleep_timer_handler.g.dart) ;;
              *) echo "ERROR: unexpected changed file: $file"; exit 1 ;;
            esac
          done

      - name: Analyze library
        run: flutter analyze lib

      - name: Run chapter target tests
        run: flutter test test/util/sleep_timer_target_test.dart

      - name: Commit validated hardening
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/util/audio_handler/bg_audio_handler.dart lib/util/handler/sleep_timer_handler.dart lib/util/handler/sleep_timer_handler.g.dart
          git commit -m "Harden chapter sleep navigation races"
          git push origin HEAD:feat/chapter-end-sleep-timer
