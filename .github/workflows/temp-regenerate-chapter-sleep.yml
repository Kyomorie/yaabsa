name: Temporary regenerate chapter sleep sources

on:
  push:
    branches:
      - feat/chapter-end-sleep-timer

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/chapter-end-sleep-timer
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate sources
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart format lib

      - name: Validate generated diff scope
        shell: bash
        run: |
          mapfile -t CHANGED < <(git diff --name-only)
          printf 'Changed files after generation:\n'
          printf '  %s\n' "${CHANGED[@]}"
          if [ "${#CHANGED[@]}" -ne 1 ] || [ "${CHANGED[0]}" != 'lib/util/handler/sleep_timer_handler.g.dart' ]; then
            echo 'ERROR: unexpected generated diff scope'
            exit 1
          fi
          git diff --check

      - name: Commit generated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/util/handler/sleep_timer_handler.g.dart
          git commit -m "Regenerate sleep timer provider"
          git push origin HEAD:feat/chapter-end-sleep-timer
