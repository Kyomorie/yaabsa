name: Temporary Android runtime smoke

on:
  push:
    branches:
      - ci/chapter-sleep-v4-runtime-smoke

permissions:
  contents: read
  actions: read

jobs:
  android-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact e04c0e1 Android APK artifact
        shell: bash
        run: |
          url='https://api.github.com/repos/Kyomorie/yaabsa/actions/artifacts/10436296620/zip'
          curl -fL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$url" -o android-artifact.zip
          rc=$?
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          mkdir -p android-artifact
          unzip -q android-artifact.zip -d android-artifact
          apk="$(find android-artifact -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ] || [ ! -f "$apk" ]; then
            echo 'No APK found in exact-head artifact'
            find android-artifact -maxdepth 4 -type f -print || true
            exit 2
          fi
          cp "$apk" yaabsa-auto-debug.apk
          echo 'Exact-head APK:'
          sha256sum yaabsa-auto-debug.apk

      - name: Prepare Android emulator
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | sort | tail -n 1)"
          if [ -z "$sdkmanager" ]; then
            echo "sdkmanager not found below $sdk_root/cmdline-tools"
            exit 3
          fi
          avdmanager="$(dirname "$sdkmanager")/avdmanager"
          emulator_bin="$sdk_root/emulator/emulator"
          if [ ! -x "$avdmanager" ] || [ ! -x "$emulator_bin" ]; then
            echo 'avdmanager or emulator is missing'
            exit 4
          fi

          image='system-images;android-35;google_apis;x86_64'
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" 'platform-tools' 'emulator' "$image"
          rc=$?
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

          avd_home="$RUNNER_TEMP/android-avd"
          mkdir -p "$avd_home"
          export ANDROID_AVD_HOME="$avd_home"
          echo no | "$avdmanager" create avd --force --name yaabsa-smoke --package "$image" --device pixel_7
          rc=$?
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

          echo 'AVD directory contents:'
          find "$avd_home" -maxdepth 2 -print
          echo 'Emulator-visible AVDs:'
          "$emulator_bin" -list-avds | tee avd-list.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if ! grep -Fxq 'yaabsa-smoke' avd-list.txt; then
            echo 'yaabsa-smoke is not visible to emulator after creation'
            exit 5
          fi

          echo "RUNTIME_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$avd_home" >> "$GITHUB_ENV"

      - name: Boot emulator with bounded device wait
        shell: bash
        run: |
          sdk_root="$RUNTIME_SDK_ROOT"
          emulator_bin="$sdk_root/emulator/emulator"
          adb_bin="$sdk_root/platform-tools/adb"
          if [ ! -x "$emulator_bin" ] || [ ! -x "$adb_bin" ]; then
            echo "Emulator or adb missing below $sdk_root"
            exit 6
          fi

          echo "Using ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          "$emulator_bin" -list-avds
          rc=$?
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

          "$adb_bin" kill-server >/dev/null 2>&1 || true
          "$adb_bin" start-server
          rc=$?
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

          accel_args=()
          if [ -e /dev/kvm ]; then
            echo '/dev/kvm is available; enabling hardware acceleration'
            sudo chmod 666 /dev/kvm || true
            accel_args=(-accel on)
          else
            echo '/dev/kvm is not available; using software acceleration'
            accel_args=(-accel off)
          fi

          "$emulator_bin" -avd yaabsa-smoke \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect "${accel_args[@]}" > emulator.log 2>&1 &
          emulator_pid=$!
          echo "$emulator_pid" > emulator.pid
          echo "emulator pid=$emulator_pid"

          device_seen=0
          i=0
          while [ "$i" -lt 60 ]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo 'Emulator process exited before ADB device appeared'
              cat emulator.log || true
              exit 7
            fi
            if "$adb_bin" devices | awk 'NR>1 && $1 ~ /^emulator-/ && $2 == "device" {found=1} END {exit !found}'; then
              device_seen=1
              break
            fi
            sleep 2
            i=$((i + 1))
          done
          if [ "$device_seen" -ne 1 ]; then
            echo 'No usable emulator ADB device appeared within 120 seconds'
            "$adb_bin" devices -l || true
            cat emulator.log || true
            exit 8
          fi

          booted=0
          i=0
          while [ "$i" -lt 90 ]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo 'Emulator process exited before Android boot completed'
              cat emulator.log || true
              exit 9
            fi
            state="$("$adb_bin" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$state" = '1' ]; then
              booted=1
              break
            fi
            sleep 2
            i=$((i + 1))
          done
          if [ "$booted" -ne 1 ]; then
            echo 'Android emulator did not finish booting within 180 seconds after ADB became ready'
            "$adb_bin" shell getprop 2>/dev/null | grep -E 'sys.boot_completed|dev.bootcomplete|init.svc.bootanim' || true
            cat emulator.log || true
            exit 10
          fi

          echo 'Android emulator boot completed'
          "$adb_bin" shell getprop ro.build.version.release
          "$adb_bin" shell getprop ro.build.version.sdk

      - name: Install and launch exact-head yaabsa APK
        shell: bash
        run: |
          adb_bin="$RUNTIME_SDK_ROOT/platform-tools/adb"
          "$adb_bin" install -r yaabsa-auto-debug.apk
          rc=$?
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

          "$adb_bin" logcat -c
          "$adb_bin" shell am start -W -n de.vito0912.yaabsa.dev/de.vito0912.yaabsa.MainActivity | tee android-start.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

          sleep 20
          app_pid="$("$adb_bin" shell pidof de.vito0912.yaabsa.dev 2>/dev/null | tr -d '\r')"
          if [ -z "$app_pid" ]; then
            echo 'yaabsa process is not alive after the 20s startup window'
            "$adb_bin" logcat -d > android-runtime-smoke.log || true
            cat android-runtime-smoke.log || true
            exit 11
          fi
          echo "yaabsa survived the 20s startup window (pid=$app_pid)"

          "$adb_bin" exec-out screencap -p > android-runtime-smoke.png
          "$adb_bin" logcat -d > android-runtime-smoke.log
          "$adb_bin" shell dumpsys activity activities > android-activities.txt

          if grep -q 'FATAL EXCEPTION' android-runtime-smoke.log; then
            echo 'FATAL EXCEPTION found in logcat'
            grep -n -A20 -B5 'FATAL EXCEPTION' android-runtime-smoke.log || true
            exit 12
          fi
          if grep -E -q 'E/flutter.*Unhandled Exception|DartError|Lost connection to device' android-runtime-smoke.log; then
            echo 'Potential Flutter/Dart runtime failure found in logcat'
            grep -E -n -A12 -B5 'E/flutter.*Unhandled Exception|DartError|Lost connection to device' android-runtime-smoke.log || true
            exit 13
          fi

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          sdk_root="${RUNTIME_SDK_ROOT:-${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}}"
          adb_bin="$sdk_root/platform-tools/adb"
          if [ -x "$adb_bin" ]; then "$adb_bin" emu kill >/dev/null 2>&1 || true; fi
          if [ -f emulator.pid ]; then
            pid="$(cat emulator.pid)"
            kill -TERM "$pid" >/dev/null 2>&1 || true
          fi

      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-runtime-smoke-evidence-avdhome
          path: |
            android-runtime-smoke.png
            android-runtime-smoke.log
            android-start.txt
            android-activities.txt
            emulator.log
            avd-list.txt
          if-no-files-found: ignore
          retention-days: 1
