      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/abs-token"

          adb="${RUNTIME_SDK_ROOT:-${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}}/platform-tools/adb"

          if [ -x "$adb" ]; then
            "$adb" reverse --remove-all >/dev/null 2>&1 || true
            "$adb" emu kill >/dev/null 2>&1 || true
          fi

          docker rm -f abs-e2e >/dev/null 2>&1 || true
