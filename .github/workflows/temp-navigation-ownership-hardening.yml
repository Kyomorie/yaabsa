name: One-shot chapter navigation ownership hardening

on:
  push:
    branches:
      - feat/chapter-end-sleep-timer
    paths:
      - .github/workflows/temp-navigation-ownership-hardening.yml

permissions:
  actions: read
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: feat/chapter-end-sleep-timer
          fetch-depth: 2
          submodules: recursive

      - name: Verify one-shot head
        shell: bash
        run: |
          expected_parent='a5cb3e01011601840a4ca7d3fae9546933a7a42c'
          workflow='.github/workflows/temp-navigation-ownership-hardening.yml'
          parent="$(git rev-parse HEAD^ 2>/dev/null)" || { echo 'Cannot resolve parent'; exit 1; }
          [ "$parent" = "$expected_parent" ] || { echo "Unexpected parent: $parent"; exit 1; }
          changed="$(git diff --name-only HEAD^ HEAD)" || { echo 'Cannot inspect one-shot commit'; exit 1; }
          [ "$changed" = "$workflow" ] || { echo "Unexpected files in one-shot commit: $changed"; exit 1; }
          echo "ONE_SHOT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for regular PR build of this exact head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          head = os.environ['ONE_SHOT_HEAD']
          token = os.environ['GH_TOKEN']
          url = (
              f'https://api.github.com/repos/{repo}/actions/workflows/pr-build.yml/runs'
              f'?event=pull_request&head_sha={head}&per_page=20'
          )
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          for _ in range(180):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              runs = payload.get('workflow_runs', [])
              if runs:
                  run = max(runs, key=lambda entry: entry.get('run_number', 0))
                  status = run.get('status')
                  conclusion = run.get('conclusion')
                  print(f"PR build #{run.get('run_number')}: {status}/{conclusion}")
                  if status == 'completed':
                      if conclusion != 'success':
                          raise SystemExit(f'Exact-head PR build did not succeed: {conclusion}')
                      raise SystemExit(0)
              time.sleep(5)
          raise SystemExit('Timed out waiting for exact-head PR build')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        shell: bash
        run: |
          flutter pub get || { echo 'flutter pub get failed'; exit 1; }

      - name: Apply navigation ownership hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          models = 'lib/util/audio_handler/bg_audio_handler_models.dart'
          replace_once(
