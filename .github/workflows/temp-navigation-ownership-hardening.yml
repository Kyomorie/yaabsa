name: One-shot chapter navigation ownership hardening

on:
  push:
    branches:
      - feat/chapter-end-sleep-timer
    paths:
      - .github/workflows/temp-navigation-ownership-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: feat/chapter-end-sleep-timer
          fetch-depth: 4
          submodules: recursive

      - name: Verify one-shot ancestry and scope
        shell: bash
        run: |
          green_base='a5cb3e01011601840a4ca7d3fae9546933a7a42c'
          expected_parent='e29db7b6cbf0c0485604894abe9f064b65fcee10'
          workflow='.github/workflows/temp-navigation-ownership-hardening.yml'
          parent="$(git rev-parse HEAD^ 2>/dev/null)" || { echo 'Cannot resolve parent'; exit 1; }
          [ "$parent" = "$expected_parent" ] || { echo "Unexpected parent: $parent"; exit 1; }
          git merge-base --is-ancestor "$green_base" HEAD || { echo 'Green base is not an ancestor'; exit 1; }
          changed="$(git diff --name-only "$green_base" HEAD)" || { echo 'Cannot inspect runner-only delta'; exit 1; }
          [ "$changed" = "$workflow" ] || { echo "Unexpected files since green base: $changed"; exit 1; }
          echo "ONE_SHOT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        shell: bash
        run: |
          flutter pub get || { echo 'flutter pub get failed'; exit 1; }

      - name: Apply navigation ownership hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def block(*lines):
              return '\n'.join(lines) + '\n'

          def replace_once(path, old, new, label):
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              target.write_text(text.replace(old, new, 1))

          models = 'lib/util/audio_handler/bg_audio_handler_models.dart'
          anchor = block('class QueueDisplayInfo {')
          ledger = block(
              'class UserSeekNavigationLedger {',
              '  final Set<int> _activeOperations = <int>{};',
              '',
              '  bool begin(int operationId) => _activeOperations.add(operationId);',
              '',
              '  bool settle(int operationId) => _activeOperations.remove(operationId);',
              '',
              '  bool get hasActive => _activeOperations.isNotEmpty;',
              '',
              '  Set<int> get activeSnapshot => Set<int>.unmodifiable(_activeOperations);',
              '}',
              '',
              'class QueueDisplayInfo {',
          )
          replace_once(models, anchor, ledger, 'navigation ledger model')

          audio = 'lib/util/audio_handler/bg_audio_handler.dart'
          replace_once(
              audio,
              block('  int _userSeekNavigationSequence = 0;'),
              block(
                  '  int _userSeekNavigationSequence = 0;',
                  '  final UserSeekNavigationLedger _userSeekNavigationLedger = UserSeekNavigationLedger();',
              ),
              'navigation ledger field',
          )
          replace_once(
              audio,
              block('  Stream<UserSeekNavigationEvent> get userSeekNavigationStream => _userSeekNavigationController.stream;'),
              block(
                  '  Stream<UserSeekNavigationEvent> get userSeekNavigationStream => _userSeekNavigationController.stream;',
                  '  Set<int> get activeUserSeekNavigationOperations => _userSeekNavigationLedger.activeSnapshot;',
                  '  bool get hasActiveUserSeekNavigation => _userSeekNavigationLedger.hasActive;',
              ),
              'navigation ledger getters',
          )
          replace_once(
              audio,
              block(
                  '  int _beginUserSeekNavigation() {',
                  '    final operationId = ++_userSeekNavigationSequence;',
                  '    if (!_userSeekNavigationController.isClosed) {',
              ),
              block(
                  '  int _beginUserSeekNavigation() {',
                  '    final operationId = ++_userSeekNavigationSequence;',
                  '    if (!_userSeekNavigationLedger.begin(operationId)) {',
                  "      throw StateError('Duplicate user navigation operation id: $operationId');",
                  '    }',
                  '    if (!_userSeekNavigationController.isClosed) {',
              ),
              'navigation begin ownership',
          )
          replace_once(
              audio,
              block(
                  '  void _settleUserSeekNavigation(int operationId, {required bool shouldRetarget}) {',
                  '    if (!_userSeekNavigationController.isClosed) {',
              ),
              block(
                  '  void _settleUserSeekNavigation(int operationId, {required bool shouldRetarget}) {',
                  '    if (!_userSeekNavigationLedger.settle(operationId)) {',
                  '      return;',
                  '    }',
                  '    if (!_userSeekNavigationController.isClosed) {',
              ),
              'navigation settle ownership',
          )
          old_queue = block(
              '      if (queueList.isNotEmpty) {',
              '        _forceQueueSwitchOnNextPlay = true;',
              '        _ignoreProgressOnNextPlay = isLoopOn;',
              '        await play();',
              '      } else {',
          )
          new_queue = block(
              '      if (queueList.isNotEmpty) {',
              '        final operationId = _beginUserSeekNavigation();',
              '        final beforeMedia = _currentMediaItem;',
              '        final beforePosition = position;',
              '        var navigationSucceeded = false;',
              '        try {',
              '          _forceQueueSwitchOnNextPlay = true;',
              '          _ignoreProgressOnNextPlay = isLoopOn;',
              '          await play();',
              '          final afterMedia = _currentMediaItem;',
              '          navigationSucceeded =',
              '              afterMedia != null &&',
              '              (beforeMedia == null ||',
              '                  !_queueItemsMatch(',
              '                    leftItemId: beforeMedia.itemId,',
              '                    leftEpisodeId: beforeMedia.episodeId,',
              '                    rightItemId: afterMedia.itemId,',
              '                    rightEpisodeId: afterMedia.episodeId,',
              '                  ) ||',
              '                  position != beforePosition);',
              '        } finally {',
              '          _settleUserSeekNavigation(operationId, shouldRetarget: navigationSucceeded);',
              '        }',
              '      } else {',
          )
          replace_once(audio, old_queue, new_queue, 'explicit queue skip navigation')

          playback = 'lib/util/audio_handler/bg_audio_handler_playback_internal.dart'
          replace_once(
              playback,
              block(
                  '    setQueueFromPodcastEpisode(item, episode);',
                  '    await play();',
              ),
              block(
                  '    final operationId = _beginUserSeekNavigation();',
                  '    var navigationSucceeded = false;',
                  '    try {',
                  '      setQueueFromPodcastEpisode(item, episode);',
                  '      await play();',
                  '      navigationSucceeded = _queueItemsMatch(',
                  "        leftItemId: _currentMediaItem?.itemId ?? '',",
                  '        leftEpisodeId: _currentMediaItem?.episodeId,',
                  '        rightItemId: item.id,',
                  '        rightEpisodeId: episode.id,',
                  '      );',
                  '    } finally {',
                  '      _settleUserSeekNavigation(operationId, shouldRetarget: navigationSucceeded);',
                  '    }',
              ),
              'podcast playback navigation',
          )
          replace_once(
              playback,
              block(
                  '    setQueueFromLibraryItem(item);',
                  '    await play();',
              ),
              block(
                  '    final operationId = _beginUserSeekNavigation();',
                  '    var navigationSucceeded = false;',
                  '    try {',
                  '      setQueueFromLibraryItem(item);',
                  '      await play();',
                  '      navigationSucceeded = _queueItemsMatch(',
                  "        leftItemId: _currentMediaItem?.itemId ?? '',",
                  '        leftEpisodeId: _currentMediaItem?.episodeId,',
                  '        rightItemId: item.id,',
                  '        rightEpisodeId: null,',
                  '      );',
                  '    } finally {',
                  '      _settleUserSeekNavigation(operationId, shouldRetarget: navigationSucceeded);',
                  '    }',
              ),
              'library playback navigation',
          )

          sleep = 'lib/util/handler/sleep_timer_handler.dart'
          replace_once(
              sleep,
              block("import 'package:yaabsa/database/settings_manager.dart';"),
              block(
                  "import 'package:yaabsa/database/settings_manager.dart';",
                  "import 'package:yaabsa/models/internal_media.dart';",
              ),
              'sleep timer media import',
          )
          replace_once(
              sleep,
              block('  StreamSubscription<UserSeekNavigationEvent>? _userSeekNavigationSubscription;'),
              block(
                  '  StreamSubscription<UserSeekNavigationEvent>? _userSeekNavigationSubscription;',
                  '  StreamSubscription<bool>? _castControlSubscription;',
                  '  StreamSubscription<InternalMedia?>? _mediaItemSubscription;',
              ),
              'sleep timer context fields',
          )
          replace_once(
              sleep,
              block(
                  '    _attachPositionListener();',
                  '    _attachUserSeekNavigationListener();',
              ),
              block(
                  '    _attachPositionListener();',
                  '    _attachUserSeekNavigationListener();',
                  '    _attachCastControlListener();',
                  '    _attachMediaItemListener();',
              ),
              'sleep timer context listener attach',
          )
          replace_once(
              sleep,
              block(
                  '      _userSeekNavigationSubscription?.cancel();',
                  '      _userSeekNavigationSubscription = null;',
              ),
              block(
                  '      _userSeekNavigationSubscription?.cancel();',
                  '      _userSeekNavigationSubscription = null;',
                  '      _castControlSubscription?.cancel();',
                  '      _castControlSubscription = null;',
                  '      _mediaItemSubscription?.cancel();',
                  '      _mediaItemSubscription = null;',
              ),
              'sleep timer context listener dispose',
          )
          listener_anchor = block('  void _handlePlayerStateChanged(PlayerState playerState) {')
          listeners = block(
              '  void _attachCastControlListener() {',
              '    try {',
              '      _castControlSubscription = audioHandler.castControlActiveStream.listen(_handleCastControlChanged);',
              '    } catch (e) {',
              "      logger('Failed to attach sleep timer Cast listener: $e', tag: 'SleepTimer', level: InfoLevel.warning);",
              '    }',
              '  }',
              '',
              '  void _attachMediaItemListener() {',
              '    try {',
              '      _mediaItemSubscription = audioHandler.mediaItemStream.listen(_handleMediaItemChanged);',
              '    } catch (e) {',
              "      logger('Failed to attach sleep timer media listener: $e', tag: 'SleepTimer', level: InfoLevel.warning);",
              '    }',
              '  }',
              '',
              '  void _handleCastControlChanged(bool isActive) {',
              '    if (isActive && state.isActive && state.mode == SleepTimerMode.chapterEnd) {',
              "      _cancelChapterTimerForContextChange('Cast control became active');",
              '    }',
              '  }',
              '',
              '  void _handleMediaItemChanged(InternalMedia? media) {',
              '    if (!state.isActive || state.mode != SleepTimerMode.chapterEnd) {',
              '      return;',
              '    }',
              '    final target = state.chapterTarget;',
              '    if (target == null ||',
              '        media == null ||',
              '        !target.matchesMedia(itemId: media.itemId, episodeId: media.episodeId)) {',
              "      _cancelChapterTimerForContextChange('playback media changed');",
              '    }',
              '  }',
              '',
              '  void _handlePlayerStateChanged(PlayerState playerState) {',
          )
          replace_once(sleep, listener_anchor, listeners, 'sleep timer context listeners')
          replace_once(
              sleep,
              block(
                  '    _syncSleepTimerCompletionGate(target);',
                  '    unawaited(_persistMarker(marker));',
              ),
              block(
                  '    final activeNavigationOperations = audioHandler.activeUserSeekNavigationOperations;',
                  '    if (activeNavigationOperations.isNotEmpty) {',
                  '      _chapterUserSeekOperations.addAll(activeNavigationOperations);',
                  '      _chapterExpiryCheckGeneration += 1;',
                  '    }',
                  '    _syncSleepTimerCompletionGate(target);',
                  '    unawaited(_persistMarker(marker));',
              ),
              'chapter timer adopts active navigation',
          )

          Path('test/util/user_seek_navigation_ledger_test.dart').write_text(block(
              "import 'package:flutter_test/flutter_test.dart';",
              "import 'package:yaabsa/util/audio_handler/bg_audio_handler.dart';",
              '',
              'void main() {',
              "  group('UserSeekNavigationLedger', () {",
              "    test('tracks active operations and returns stable snapshots', () {",
              '      final ledger = UserSeekNavigationLedger();',
              '',
              '      expect(ledger.hasActive, isFalse);',
              '      expect(ledger.begin(1), isTrue);',
              '      final firstSnapshot = ledger.activeSnapshot;',
              '      expect(firstSnapshot, <int>{1});',
              '',
              '      expect(ledger.begin(2), isTrue);',
              '      expect(ledger.activeSnapshot, <int>{1, 2});',
              '      expect(firstSnapshot, <int>{1});',
              '      expect(ledger.hasActive, isTrue);',
              '    });',
              '',
              "    test('settlement is idempotent and only removes owned operations', () {",
              '      final ledger = UserSeekNavigationLedger();',
              '      expect(ledger.begin(7), isTrue);',
              '      expect(ledger.settle(7), isTrue);',
              '      expect(ledger.settle(7), isFalse);',
              '      expect(ledger.settle(99), isFalse);',
              '      expect(ledger.hasActive, isFalse);',
              '      expect(ledger.activeSnapshot, isEmpty);',
              '    });',
              '  });',
              '}',
          ))

          Path('.github/workflows/temp-navigation-ownership-hardening.yml').unlink()
          PY

      - name: Format and regenerate provider
        shell: bash
        run: |
          dart format \
            lib/util/audio_handler/bg_audio_handler.dart \
            lib/util/audio_handler/bg_audio_handler_models.dart \
            lib/util/audio_handler/bg_audio_handler_playback_internal.dart \
            lib/util/handler/sleep_timer_handler.dart \
            test/util/user_seek_navigation_ledger_test.dart || { echo 'dart format failed'; exit 1; }
          dart run build_runner build --build-filter=lib/util/handler/sleep_timer_handler.g.dart || { echo 'provider generation failed'; exit 1; }

          i=0
          while [ -e .git/index.lock ] && [ "$i" -lt 20 ]; do
            i=$((i + 1))
            sleep 1
          done
          if [ -e .git/index.lock ]; then
            if pgrep -x git >/dev/null 2>&1; then
              echo 'git index lock is still owned by a running git process'
              exit 1
            fi
            echo 'Removing stale git index lock left after generator completion'
            rm -f .git/index.lock || { echo 'Could not remove stale index lock'; exit 1; }
          fi

          while IFS= read -r file; do
            case "$file" in
              .github/workflows/temp-navigation-ownership-hardening.yml|lib/util/audio_handler/bg_audio_handler.dart|lib/util/audio_handler/bg_audio_handler_models.dart|lib/util/audio_handler/bg_audio_handler_playback_internal.dart|lib/util/handler/sleep_timer_handler.dart|lib/util/handler/sleep_timer_handler.g.dart|test/util/user_seek_navigation_ledger_test.dart) ;;
              *) git restore -- "$file" || { echo "Could not restore unrelated generated file: $file"; exit 1; } ;;
            esac
          done < <(git diff --name-only)

          if [ -f lib/util/handler/sleep_timer_handler.g.dart ]; then
            dart format lib/util/handler/sleep_timer_handler.g.dart || { echo 'generated provider format failed'; exit 1; }
          fi
          git diff --check || { echo 'git diff --check failed'; exit 1; }

      - name: Validate exact diff scope
        shell: bash
        run: |
          actual="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/temp-navigation-ownership-hardening.yml \
            lib/util/audio_handler/bg_audio_handler.dart \
            lib/util/audio_handler/bg_audio_handler_models.dart \
            lib/util/audio_handler/bg_audio_handler_playback_internal.dart \
            lib/util/handler/sleep_timer_handler.dart \
            lib/util/handler/sleep_timer_handler.g.dart \
            test/util/user_seek_navigation_ledger_test.dart | sort)"
          [ "$actual" = "$expected" ] || {
            echo 'Unexpected diff scope'
            echo '--- actual ---'
            printf '%s\n' "$actual"
            echo '--- expected ---'
            printf '%s\n' "$expected"
            exit 1
          }

      - name: Analyze library
        shell: bash
        run: |
          flutter analyze lib || { echo 'flutter analyze lib failed'; exit 1; }

      - name: Run focused ownership tests
        shell: bash
        run: |
          flutter test \
            test/util/sleep_timer_target_test.dart \
            test/util/user_seek_navigation_ledger_test.dart || { echo 'focused tests failed'; exit 1; }

      - name: Verify remote head and commit validated hardening
        shell: bash
        run: |
          git fetch origin feat/chapter-end-sleep-timer --depth=1 || { echo 'remote refresh failed'; exit 1; }
          local_head="$(git rev-parse HEAD)" || { echo 'cannot read local head'; exit 1; }
          remote_head="$(git rev-parse origin/feat/chapter-end-sleep-timer)" || { echo 'cannot read remote head'; exit 1; }
          [ "$local_head" = "$ONE_SHOT_HEAD" ] || { echo "Local head changed: $local_head"; exit 1; }
          [ "$remote_head" = "$ONE_SHOT_HEAD" ] || { echo "Remote head changed: $remote_head"; exit 1; }

          git config user.name 'github-actions[bot]' || { echo 'git user config failed'; exit 1; }
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com' || { echo 'git email config failed'; exit 1; }
          git add -A || { echo 'git add failed'; exit 1; }
          git commit -m 'Harden chapter navigation ownership' || { echo 'git commit failed'; exit 1; }
          git push origin HEAD:feat/chapter-end-sleep-timer || { echo 'git push failed'; exit 1; }
