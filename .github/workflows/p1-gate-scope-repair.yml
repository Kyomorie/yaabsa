name: P1 gate repair

on:
  push:
    branches: [automation/p1-backend-acceptance]

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/p1-backend-acceptance
          fetch-depth: 2
      - name: Patch scope accounting
        shell: bash
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/p1-backend-acceptance-apply.yml')
          text = path.read_text()
          needle = '          git diff --check\n          actual="$(git diff --name-only | sort)"\n'
          replacement = (
              '          git diff --check\n'
              '          git add -N lib/util/audio_handler/playback_start_attempt.dart test/util/playback_start_attempt_test.dart\n'
              '          actual="$(git diff --name-only | sort)"\n'
          )
          parts = text.split(needle)
          if len(parts) != 4:
              raise SystemExit(f'Expected three scope blocks, found {len(parts) - 1}')
          text = parts[0] + needle + parts[1] + replacement + parts[2] + replacement + parts[3]
          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = '.github/workflows/p1-backend-acceptance-apply.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/p1-backend-acceptance-apply.yml
          git commit -m 'ci: include untracked P1 files in scope gate'
          remote="$(git ls-remote origin refs/heads/automation/p1-backend-acceptance | cut -f1)"
          test "$remote" = "$before"
          git push origin HEAD:refs/heads/automation/p1-backend-acceptance
