name: P1 gate repair

on:
  push:
    branches: [automation/p1-backend-acceptance]

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/p1-backend-acceptance
          fetch-depth: 2
      - name: Patch scope accounting
        shell: bash
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          python3 -c 'from pathlib import Path; p=Path(".github/workflows/p1-backend-acceptance-apply.yml"); s=p.read_text(); old="          git diff --check\n          actual=\\\"$(git diff --name-only | sort)\\\"\n"; new="          git diff --check\n          git add -N \\\\\n            lib/util/audio_handler/playback_start_attempt.dart \\\\\n            test/util/playback_start_attempt_test.dart\n          actual=\\\"$(git diff --name-only | sort)\\\"\n"; assert s.count(old)==2, s.count(old); p.write_text(s.replace(old,new))'
          git diff --check
          test "$(git diff --name-only)" = '.github/workflows/p1-backend-acceptance-apply.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/p1-backend-acceptance-apply.yml
          git commit -m 'ci: include untracked P1 files in scope gate'
          remote="$(git ls-remote origin refs/heads/automation/p1-backend-acceptance | cut -f1)"
          test "$remote" = "$before"
          git push origin HEAD:refs/heads/automation/p1-backend-acceptance
