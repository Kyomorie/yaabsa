name: PR F12 state hardening

on:
  push:
    branches:
      - feat/chapter-end-sleep-timer
    paths:
      - .github/workflows/pr-f12-state-hardening.yml

permissions: {}

jobs:
  harden-f12:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          submodules: recursive

      - name: Verify expected parent and workflow-only trigger commit
        shell: bash
        run: |
          expected_parent='ac778f735eadf6f63d91fe08b58ae5af12165e32'
          actual_parent="$(git rev-parse HEAD^)"
          if [[ "$actual_parent" != "$expected_parent" ]]; then
            echo "Unexpected parent: $actual_parent" >&2
            exit 1
          fi
          changed="$(git diff --name-only HEAD^ HEAD)"
          if [[ "$changed" != '.github/workflows/pr-f12-state-hardening.yml' ]]; then
            echo "Trigger commit changed unexpected paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply exact F12 source and regression-test fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected replacement count 1, got {count}')
              target.write_text(text.replace(old, new, 1))

          gate_path = Path('lib/util/audio_handler/sleep_timer_completion_gate.dart')
          gate_text = gate_path.read_text()
          helper = """bool playbackStatePlayingForSleepTimerCompletion({
            required bool playerPlaying,
            required bool suppressCompletedAutoAdvance,
          }) {
            return playerPlaying && !suppressCompletedAutoAdvance;
          }
          """
          if 'playbackStatePlayingForSleepTimerCompletion' in gate_text:
              raise SystemExit('completion playing helper already exists')
          gate_path.write_text(helper + '\n' + gate_text)

          replace_once(
              'lib/util/audio_handler/bg_audio_handler.dart',
              """    final controlState = castActive ? playerControlState : _player.playerState;
              final playPauseControl = controlState.playing ? MediaControl.pause : MediaControl.play;
          """,
              """    final controlState = castActive ? playerControlState : _player.playerState;
              final effectivePlaying = playbackStatePlayingForSleepTimerCompletion(
                playerPlaying: controlState.playing,
                suppressCompletedAutoAdvance: sleepTimerSuppressesCompletedAutoAdvance,
              );
              final playPauseControl = effectivePlaying ? MediaControl.pause : MediaControl.play;
          """,
          )

          replace_once(
              'lib/util/audio_handler/bg_audio_handler.dart',
              '        playing: hasPlaybackContext && (isTransitionLoading ? true : controlState.playing),\n',
              '        playing: hasPlaybackContext && (isTransitionLoading ? true : effectivePlaying),\n',
          )

          replace_once(
              'test/util/sleep_timer_completion_gate_test.dart',
              """void main() {
            group('SleepTimerCompletionGateLedger', () {
          """,
              """void main() {
            group('playbackStatePlayingForSleepTimerCompletion', () {
              test('suppressed final completion is published as not playing', () {
                expect(
                  playbackStatePlayingForSleepTimerCompletion(
                    playerPlaying: true,
                    suppressCompletedAutoAdvance: true,
                  ),
                  isFalse,
                );
              });

              test('ordinary playback preserves the player playing state', () {
                expect(
                  playbackStatePlayingForSleepTimerCompletion(
                    playerPlaying: true,
                    suppressCompletedAutoAdvance: false,
                  ),
                  isTrue,
                );
              });

              test('paused playback remains paused without suppression', () {
                expect(
                  playbackStatePlayingForSleepTimerCompletion(
                    playerPlaying: false,
                    suppressCompletedAutoAdvance: false,
                  ),
                  isFalse,
                );
              });
            });

            group('SleepTimerCompletionGateLedger', () {
          """,
          )
          PY

          dart format \
            lib/util/audio_handler/sleep_timer_completion_gate.dart \
            lib/util/audio_handler/bg_audio_handler.dart \
            test/util/sleep_timer_completion_gate_test.dart

          if ! git diff --check; then
            echo 'git diff --check failed' >&2
            exit 1
          fi

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            lib/util/audio_handler/bg_audio_handler.dart \
            lib/util/audio_handler/sleep_timer_completion_gate.dart \
            test/util/sleep_timer_completion_gate_test.dart | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Unexpected changed paths after F12 fix:' >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

      - name: Commit locally after exact diff gate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/util/audio_handler/bg_audio_handler.dart \
            lib/util/audio_handler/sleep_timer_completion_gate.dart \
            test/util/sleep_timer_completion_gate_test.dart
          git commit -m 'fix: normalize final sleep completion playback state'

      - name: Run repository checks
        uses: ./.github/actions/check-requirements

      - name: Run focused sleep timer and ownership tests
        shell: bash
        run: >-
          flutter test
          test/util/player_mutation_barrier_test.dart
          test/util/sleep_timer_completion_gate_test.dart
          test/util/sleep_timer_target_test.dart
          test/util/user_seek_navigation_ledger_test.dart

      - name: Verify source commit and remote ownership before push
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD^)" != '${{ github.sha }}' ]]; then
            echo 'Local source commit has unexpected parent' >&2
            exit 1
          fi
          actual="$(git diff --name-only HEAD^ HEAD | sort)"
          expected="$(printf '%s\n' \
            lib/util/audio_handler/bg_audio_handler.dart \
            lib/util/audio_handler/sleep_timer_completion_gate.dart \
            test/util/sleep_timer_completion_gate_test.dart | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Local source commit has unexpected paths:' >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          remote_head="$(git ls-remote origin refs/heads/feat/chapter-end-sleep-timer | cut -f1)"
          if [[ "$remote_head" != '${{ github.sha }}' ]]; then
            echo "Branch moved externally: $remote_head" >&2
            exit 1
          fi
          git status --short
          if [[ -n "$(git status --porcelain)" ]]; then
            echo 'Working tree is not clean after validation' >&2
            exit 1
          fi

      - name: Push validated F12 fix
        shell: bash
        run: git push origin HEAD:refs/heads/feat/chapter-end-sleep-timer
