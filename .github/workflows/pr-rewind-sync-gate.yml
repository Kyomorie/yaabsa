name: PR rewind sync gate

on:
  pull_request:
    types:
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: recursive

      - name: Apply exact rewind sync serialization fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/util/audio_handler/bg_audio_handler_resume.dart')
          text = path.read_text()
          old = """    final currentPositionSeconds = targetPosition.inMicroseconds / Duration.microsecondsPerSecond;
    final canReachServer = _ref.read(serverReachabilityProvider);

    try {
      await _ref
          .read(sessionRepositoryProvider)
          .syncOpenSession(currentPositionSeconds, 0.3, canReachServer: canReachServer);
    } catch (e) {
      logger('Failed to sync sleep timer rewind before stop: $e', tag: 'AudioHandler', level: InfoLevel.warning);
    }
"""
          new = """    try {
      await _syncService.flush(positionOverride: targetPosition);
    } catch (e) {
      logger('Failed to sync sleep timer rewind after expiry: $e', tag: 'AudioHandler', level: InfoLevel.warning);
    }
"""
          old_count = text.count(old)
          new_count = text.count(new)
          if old_count == 1 and new_count == 0:
              path.write_text(text.replace(old, new, 1))
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(
                  f'unexpected rewind sync source state: old={old_count}, new={new_count}; refusing to mutate'
              )
          PY
          git diff --check
          git diff -- lib/util/audio_handler/bg_audio_handler_resume.dart

      - name: Run repository checks
        uses: ./.github/actions/check-requirements

      - name: Run focused sleep timer and ownership tests
        shell: bash
        run: >-
          flutter test
          test/util/player_mutation_barrier_test.dart
          test/util/sleep_timer_completion_gate_test.dart
          test/util/sleep_timer_target_test.dart
          test/util/user_seek_navigation_ledger_test.dart

      - name: Commit verified fix when needed
        shell: bash
        run: |
          if git diff --quiet -- lib/util/audio_handler/bg_audio_handler_resume.dart; then
            echo 'Exact rewind sync fix already present.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/util/audio_handler/bg_audio_handler_resume.dart
          git commit -m 'fix: serialize sleep timer rewind progress sync'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
