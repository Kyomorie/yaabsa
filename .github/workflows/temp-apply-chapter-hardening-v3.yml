name: Temporary apply chapter sleep hardening v3

on:
  push:
    branches:
      - feat/chapter-end-sleep-timer

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/chapter-end-sleep-timer
          submodules: recursive

      - name: Apply chapter sleep hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          def replace_between(path, start, end, replacement, label):
              p = Path(path)
              text = p.read_text()
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f'{label}: start marker missing')
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f'{label}: end marker missing')
              if text.find(start, start_index + len(start)) >= 0:
                  raise SystemExit(f'{label}: start marker is not unique')
              p.write_text(text[:start_index] + replacement + text[end_index:])

          models = 'lib/util/audio_handler/bg_audio_handler_models.dart'
          replace_once(
              models,
              'const int _autoQueuePageSize = 20;\n',
              '''const int _autoQueuePageSize = 20;\n\nenum UserSeekNavigationPhase { began, settled }\n\nclass UserSeekNavigationEvent {\n  const UserSeekNavigationEvent({\n    required this.operationId,\n    required this.phase,\n    this.shouldRetarget = false,\n  });\n\n  final int operationId;\n  final UserSeekNavigationPhase phase;\n  final bool shouldRetarget;\n}\n''',
              'navigation model',
          )

          audio = 'lib/util/audio_handler/bg_audio_handler.dart'
          replace_once(
              audio,
              '''  int _internalSeekGuardDepth = 0;\n  bool _chapterNotificationEnabled = false;\n  Duration _chapterNotificationOffset = Duration.zero;\n  Duration _chapterNotificationDuration = Duration.zero;\n  bool _isInternalSeek = false;\n''',
              '''  int _internalSeekGuardDepth = 0;\n  final StreamController<UserSeekNavigationEvent> _userSeekNavigationController =\n      StreamController<UserSeekNavigationEvent>.broadcast(sync: true);\n  int _userSeekNavigationSequence = 0;\n  bool _chapterNotificationEnabled = false;\n  Duration _chapterNotificationOffset = Duration.zero;\n  Duration _chapterNotificationDuration = Duration.zero;\n''',
              'navigation stream fields',
          )
          replace_once(
              audio,
              '''  bool get isCastControlActive => _castControlActiveSubject.value;\n\n  bool get _supportsCastPlatform => !kIsWeb && (Platform.isAndroid || Platform.isIOS);\n''',
              '''  bool get isCastControlActive => _castControlActiveSubject.value;\n  Stream<UserSeekNavigationEvent> get userSeekNavigationStream => _userSeekNavigationController.stream;\n\n  bool get _supportsCastPlatform => !kIsWeb && (Platform.isAndroid || Platform.isIOS);\n''',
              'navigation stream getter',
          )
          replace_once(
              audio,
              '''  Future<bool> playItemFromPosition({\n    required String itemId,\n    String? episodeId,\n    required Duration position,\n    bool preserveQueue = false,\n  }) async {\n    return _playItemFromPositionInternal(\n      itemId: itemId,\n      episodeId: episodeId,\n      position: position,\n      preserveQueue: preserveQueue,\n    );\n  }\n''',
              '''  Future<bool> playItemFromPosition({\n    required String itemId,\n    String? episodeId,\n    required Duration position,\n    bool preserveQueue = false,\n    bool userNavigation = true,\n  }) async {\n    if (!userNavigation) {\n      return _playItemFromPositionInternal(\n        itemId: itemId,\n        episodeId: episodeId,\n        position: position,\n        preserveQueue: preserveQueue,\n      );\n    }\n\n    final operationId = _beginUserSeekNavigation();\n    var succeeded = false;\n    try {\n      succeeded = await _playItemFromPositionInternal(\n        itemId: itemId,\n        episodeId: episodeId,\n        position: position,\n        preserveQueue: preserveQueue,\n      );\n      return succeeded;\n    } finally {\n      _settleUserSeekNavigation(operationId, shouldRetarget: succeeded);\n    }\n  }\n''',
              'playItemFromPosition lifecycle',
          )
          replace_once(
              audio,
              '    await _seekInternal(newPosition);\n',
              '    await _seekInternal(newPosition, userNavigation: true);\n',
              'fast-forward lifecycle',
          )
          replace_once(
              audio,
              '''    if (newPosition < Duration.zero) {\n      logger('Rewind position is negative, resetting to zero', tag: 'AudioHandler', level: InfoLevel.debug);\n      await _seekInternal(Duration.zero);\n    } else {\n      await _seekInternal(newPosition);\n    }\n''',
              '''    if (newPosition < Duration.zero) {\n      logger('Rewind position is negative, resetting to zero', tag: 'AudioHandler', level: InfoLevel.debug);\n      await _seekInternal(Duration.zero, userNavigation: true);\n    } else {\n      await _seekInternal(newPosition, userNavigation: true);\n    }\n''',
              'rewind lifecycle',
          )
          replace_once(
              audio,
              '        await _seekInternal(newPosition);\n',
              '        await _seekInternal(newPosition, userNavigation: true);\n',
              'next-chapter lifecycle',
          )
          replace_once(
              audio,
              '        await _seekInternal(newPosition);\n',
              '        await _seekInternal(newPosition, userNavigation: true);\n',
              'previous-chapter lifecycle',
          )
          replace_once(
              audio,
              '        await seek(Duration.zero);\n',
              '        await _seekInternal(Duration.zero);\n',
              'automatic completion restart seek',
          )

          replace_between(
              audio,
              '  @override\n  Future<void> seek(Duration position) async {\n',
              '  void _refreshChapterNotificationState({Duration? customPosition}) {\n',
              '''  @override\n  Future<void> seek(Duration position) {\n    return _seekResolved(\n      position,\n      positionIsAbsolute: false,\n      userNavigation: true,\n      recordManualSeek: true,\n    );\n  }\n\n  Future<void> _seekResolved(\n    Duration requestedPosition, {\n    required bool positionIsAbsolute,\n    required bool userNavigation,\n    required bool recordManualSeek,\n  }) async {\n    final media = _currentMediaItem;\n    if (media == null) {\n      return;\n    }\n\n    final fromPosition = position;\n    var resolvedPosition = requestedPosition;\n    if (_chapterNotificationEnabled && !positionIsAbsolute) {\n      resolvedPosition = _chapterNotificationOffset + requestedPosition;\n    }\n\n    final maxPosition = media.totalDuration;\n    final boundedPosition = resolvedPosition < Duration.zero\n        ? Duration.zero\n        : (resolvedPosition > maxPosition ? maxPosition : resolvedPosition);\n    final shouldRetarget = boundedPosition != fromPosition;\n    final operationId = userNavigation ? _beginUserSeekNavigation() : null;\n    var navigationSucceeded = false;\n\n    try {\n      if (recordManualSeek && (boundedPosition - fromPosition).abs() >= const Duration(seconds: 1)) {\n        _syncService.markProgressDirty();\n      }\n\n      final shouldRecordPausedManualSeek =\n          _internalSeekGuardDepth == 0 &&\n          !playerControlState.playing &&\n          (playerControlState.processingState == ProcessingState.ready ||\n              playerControlState.processingState == ProcessingState.completed);\n      if (shouldRecordPausedManualSeek) {\n        _markPausedManualSeek(boundedPosition);\n      }\n\n      if (isCastControlActive) {\n        final relativePosition = _absoluteToCastRelativePosition(boundedPosition);\n        await GoogleCastRemoteMediaClient.instance.seek(GoogleCastMediaSeekOption(position: relativePosition));\n        navigationSucceeded = true;\n        _refreshPlayerControlState();\n        _refreshChapterNotificationState(customPosition: boundedPosition);\n        _updateMediaItemForChapterNotification(customPosition: boundedPosition);\n        await _updatePlaybackState();\n        if (recordManualSeek) {\n          _recordManualSeekIfNeeded(fromPosition, boundedPosition);\n        }\n        return;\n      }\n\n      final newTrackIndex = media.getIndexForDuration(boundedPosition);\n      if (newTrackIndex < 0) {\n        logger(\n          'Ignoring seek with invalid track index for position: $boundedPosition',\n          tag: 'AudioHandler',\n          level: InfoLevel.warning,\n        );\n        return;\n      }\n      logger(\n        'Seeking to position: $boundedPosition, track index: $newTrackIndex',\n        tag: 'AudioHandler',\n        level: InfoLevel.debug,\n      );\n      final relativeTrackPosition = boundedPosition - media.startDurationForTrack(newTrackIndex);\n\n      if (newTrackIndex != _currentTrackIndex) {\n        _currentTrackIndex = newTrackIndex;\n        await _player.seek(relativeTrackPosition, index: _currentTrackIndex);\n        if (!kIsWeb && (Platform.isWindows || Platform.isLinux)) {\n          // Bugfix for Windows as it doesn't seek correctly if the index changed\n          _player.playerStateStream.firstWhere((state) => state.processingState == ProcessingState.ready).then((_) async {\n            await _player.seek(relativeTrackPosition, index: _currentTrackIndex);\n          });\n        }\n      } else {\n        await _player.seek(relativeTrackPosition, index: _currentTrackIndex);\n      }\n      navigationSucceeded = true;\n\n      _refreshChapterNotificationState(customPosition: boundedPosition);\n      _updateMediaItemForChapterNotification(customPosition: boundedPosition);\n      unawaited(_updatePlaybackState());\n      if (recordManualSeek) {\n        _recordManualSeekIfNeeded(fromPosition, boundedPosition);\n      }\n    } finally {\n      if (operationId != null) {\n        _settleUserSeekNavigation(\n          operationId,\n          shouldRetarget: navigationSucceeded && shouldRetarget,\n        );\n      }\n    }\n  }\n\n  void _recordManualSeekIfNeeded(Duration fromPosition, Duration toPosition) {\n    if ((toPosition - fromPosition).abs() < const Duration(seconds: 1)) {\n      return;\n    }\n\n    unawaited(\n      PlayerHistoryHandler.addPlayerHistory(\n        PlayerHistoryType.seek,\n        position: toPosition,\n        details: <String, Object?>{'fromPosition': fromPosition.inSeconds, 'toPosition': toPosition.inSeconds},\n      ),\n    );\n  }\n\n''',
              'seek implementation',
          )

          replace_once(
              audio,
              '''  Future<void> _seekInternal(Duration position) async {\n    _isInternalSeek = true;\n    try {\n      await seek(position);\n    } finally {\n      _isInternalSeek = false;\n    }\n  }\n\n  Future<void> seekAbsolute(Duration position) => _seekInternal(position);\n''',
              '''  int _beginUserSeekNavigation() {\n    final operationId = ++_userSeekNavigationSequence;\n    if (!_userSeekNavigationController.isClosed) {\n      _userSeekNavigationController.add(\n        UserSeekNavigationEvent(operationId: operationId, phase: UserSeekNavigationPhase.began),\n      );\n    }\n    return operationId;\n  }\n\n  void _settleUserSeekNavigation(int operationId, {required bool shouldRetarget}) {\n    if (!_userSeekNavigationController.isClosed) {\n      _userSeekNavigationController.add(\n        UserSeekNavigationEvent(\n          operationId: operationId,\n          phase: UserSeekNavigationPhase.settled,\n          shouldRetarget: shouldRetarget,\n        ),\n      );\n    }\n  }\n\n  Future<void> _seekInternal(Duration position, {bool userNavigation = false}) {\n    return _seekResolved(\n      position,\n      positionIsAbsolute: true,\n      userNavigation: userNavigation,\n      recordManualSeek: false,\n    );\n  }\n\n  Future<void> seekAbsolute(Duration position) => _seekInternal(position, userNavigation: true);\n''',
              'navigation lifecycle helpers',
          )
          replace_once(
              audio,
              '''    await _lastPlayedMiniPlayerSnapshotSubject.close();\n  }\n''',
              '''    await _lastPlayedMiniPlayerSnapshotSubject.close();\n    await _userSeekNavigationController.close();\n  }\n''',
              'navigation stream disposal',
          )

          resume = 'lib/util/audio_handler/bg_audio_handler_resume.dart'
          replace_once(
              resume,
              '''      await playItemFromPosition(\n        itemId: lastPlayedItem.itemId,\n        episodeId: lastPlayedItem.episodeId,\n        position: resumePosition,\n        preserveQueue: canPreserveRestoredManualQueue,\n      );\n''',
              '''      await playItemFromPosition(\n        itemId: lastPlayedItem.itemId,\n        episodeId: lastPlayedItem.episodeId,\n        position: resumePosition,\n        preserveQueue: canPreserveRestoredManualQueue,\n        userNavigation: false,\n      );\n''',
              'internal last-played resume',
          )

          settings = 'lib/util/setting_key.dart'
          replace_once(
              settings,
              "  static const String sleepTimerLastDurationMinutes = 'sleep_timer_last_duration_minutes';\n",
              "  static const String sleepTimerLastDurationMinutes = 'sleep_timer_last_duration_minutes';\n  static const String sleepTimerLastMode = 'sleep_timer_last_mode';\n",
              'last mode setting key',
          )
          replace_once(
              settings,
              '  SettingKeys.sleepTimerLastDurationMinutes: 30,\n',
              "  SettingKeys.sleepTimerLastDurationMinutes: 30,\n  SettingKeys.sleepTimerLastMode: 'duration',\n",
              'last mode setting default',
          )

          sleep = 'lib/util/handler/sleep_timer_handler.dart'
          replace_once(
              sleep,
              '''  StreamSubscription<Duration>? _positionSubscription;\n  StreamSubscription<PositionDiscontinuity>? _positionDiscontinuitySubscription;\n''',
              '''  StreamSubscription<Duration>? _positionSubscription;\n  StreamSubscription<UserSeekNavigationEvent>? _userSeekNavigationSubscription;\n''',
              'navigation subscription',
          )
          replace_once(
              sleep,
              '''  Timer? _markerRangeHideTimer;\n  Timer? _chapterSeekSettleTimer;\n  int _chapterRunGeneration = 0;\n''',
              '''  Timer? _markerRangeHideTimer;\n  final Set<int> _chapterUserSeekOperations = <int>{};\n  bool _chapterUserSeekShouldRetarget = false;\n  int _chapterRunGeneration = 0;\n''',
              'navigation state',
          )
          replace_once(
              sleep,
              '''    _attachPlaybackStateListener();\n    _attachPositionListener();\n    _attachPositionDiscontinuityListener();\n''',
              '''    _attachPlaybackStateListener();\n    _attachPositionListener();\n    _attachUserSeekNavigationListener();\n''',
              'attach navigation listener',
          )
          replace_once(
              sleep,
              '''      _positionSubscription?.cancel();\n      _positionSubscription = null;\n      _positionDiscontinuitySubscription?.cancel();\n      _positionDiscontinuitySubscription = null;\n''',
              '''      _positionSubscription?.cancel();\n      _positionSubscription = null;\n      _userSeekNavigationSubscription?.cancel();\n      _userSeekNavigationSubscription = null;\n''',
              'dispose navigation listener',
          )
          replace_between(
              sleep,
              '  void _attachPositionDiscontinuityListener() {\n',
              '  void _handlePlayerStateChanged(PlayerState playerState) {\n',
              '''  void _attachUserSeekNavigationListener() {\n    try {\n      _userSeekNavigationSubscription = audioHandler.userSeekNavigationStream.listen(_handleUserSeekNavigation);\n    } catch (e) {\n      logger('Failed to attach sleep timer user-seek listener: $e', tag: 'SleepTimer', level: InfoLevel.warning);\n    }\n  }\n\n''',
              'navigation listener method',
          )
          replace_once(
              sleep,
              '''    if (!wasRunning && isRunning) {\n      if (!state.isActive) {\n        audioHandler.clearSleepTimerCompletionGate();\n      }\n''',
              '''    if (!wasRunning && isRunning) {\n      if (!state.isActive) {\n        if (_chapterExpiryClaimed) {\n          _invalidateChapterRun();\n        }\n        audioHandler.clearSleepTimerCompletionGate();\n      }\n''',
              'manual resume stale expiry guard',
          )
          replace_once(
              sleep,
              '''    if (_chapterSeekSettleTimer != null) {\n      return;\n    }\n''',
              '''    if (_chapterUserSeekOperations.isNotEmpty) {\n      return;\n    }\n''',
              'position pending-navigation guard',
          )
          replace_between(
              sleep,
              '  void _handlePositionDiscontinuity(PositionDiscontinuity discontinuity) {\n',
              '  void _scheduleChapterExpiryCheck(int runGeneration) {\n',
              '''  void _handleUserSeekNavigation(UserSeekNavigationEvent event) {\n    if (event.phase == UserSeekNavigationPhase.began) {\n      if (_chapterExpiryClaimed) {\n        if (!state.isActive) {\n          _invalidateChapterRun();\n          audioHandler.clearSleepTimerCompletionGate();\n        }\n        return;\n      }\n\n      if (!state.isRunning || state.mode != SleepTimerMode.chapterEnd || audioHandler.isCastControlActive) {\n        return;\n      }\n\n      _chapterUserSeekOperations.add(event.operationId);\n      _chapterExpiryCheckGeneration += 1;\n      return;\n    }\n\n    final removed = _chapterUserSeekOperations.remove(event.operationId);\n    if (!removed) {\n      return;\n    }\n    _chapterUserSeekShouldRetarget = _chapterUserSeekShouldRetarget || event.shouldRetarget;\n    if (_chapterUserSeekOperations.isNotEmpty) {\n      return;\n    }\n\n    final shouldRetarget = _chapterUserSeekShouldRetarget;\n    _chapterUserSeekShouldRetarget = false;\n    if (!state.isRunning || state.mode != SleepTimerMode.chapterEnd || audioHandler.isCastControlActive) {\n      return;\n    }\n\n    _resolveChapterTimerAfterUserNavigation(\n      _chapterRunGeneration,\n      shouldRetarget: shouldRetarget,\n    );\n  }\n\n  void _resolveChapterTimerAfterUserNavigation(int runGeneration, {required bool shouldRetarget}) {\n    if (!_isChapterRunCurrent(runGeneration) ||\n        !state.isRunning ||\n        state.mode != SleepTimerMode.chapterEnd ||\n        audioHandler.isCastControlActive) {\n      return;\n    }\n\n    final previousTarget = state.chapterTarget;\n    final media = audioHandler.currentMediaItem;\n    if (previousTarget == null ||\n        media == null ||\n        !previousTarget.matchesMedia(itemId: media.itemId, episodeId: media.episodeId)) {\n      _cancelChapterTimerForContextChange('playback media changed while seeking');\n      return;\n    }\n\n    final position = audioHandler.position;\n    if (!shouldRetarget) {\n      if (position >= previousTarget.endPosition) {\n        _claimChapterExpiry(runGeneration);\n        return;\n      }\n      state = state.copyWith(remainingTime: previousTarget.remainingAt(position));\n      return;\n    }\n\n    if (position >= media.totalDuration) {\n      _cancelChapterTimerForContextChange('seek landed at media end');\n      return;\n    }\n\n    final nextTarget = resolveChapterSleepTarget(\n      chapters: media.chapters,\n      mediaDuration: media.totalDuration,\n      position: position,\n      itemId: media.itemId,\n      episodeId: media.episodeId,\n    );\n    if (nextTarget == null) {\n      _cancelChapterTimerForContextChange('seek landed outside a valid chapter');\n      return;\n    }\n\n    final remaining = nextTarget.remainingAt(position);\n    state = state.copyWith(remainingTime: remaining, chapterTarget: nextTarget, clearTotalDuration: true);\n    _syncSleepTimerCompletionGate(nextTarget);\n\n    if (nextTarget.endPosition != previousTarget.endPosition) {\n      logger(\n        'Chapter sleep timer retargeted to ${nextTarget.endPosition.inSeconds}s after user navigation',\n        tag: 'SleepTimer',\n        level: InfoLevel.info,\n      );\n    }\n  }\n\n''',
              'explicit user navigation handler',
          )
          replace_once(
              sleep,
              '''          !_isChapterRunCurrent(runGeneration) ||\n          _chapterSeekSettleTimer != null ||\n          !state.isRunning ||\n''',
              '''          !_isChapterRunCurrent(runGeneration) ||\n          _chapterUserSeekOperations.isNotEmpty ||\n          !state.isRunning ||\n''',
              'expiry pending-navigation guard',
          )
          replace_once(
              sleep,
              '''    _chapterExpiryClaimed = false;\n    _chapterSeekSettleTimer?.cancel();\n    _chapterSeekSettleTimer = null;\n''',
              '''    _chapterExpiryClaimed = false;\n    _chapterUserSeekOperations.clear();\n    _chapterUserSeekShouldRetarget = false;\n''',
              'invalidate navigation state',
          )
          replace_once(
              sleep,
              '''      if (_isChapterRunCurrent(generation)) {\n        await _restoreFadeVolumeIfNeeded();\n      }\n''',
              '''      if (_isChapterRunCurrent(generation)) {\n        await _restoreFadeVolumeIfNeeded();\n        _chapterExpiryClaimed = false;\n      }\n''',
              'expiry claim cleanup',
          )

          replace_once(
              sleep,
              '''  Future<void> _persistLastDuration(Duration duration) async {\n    final minutes = duration.inMinutes < 1 ? 1 : duration.inMinutes;\n    try {\n      await ref\n          .read(settingsManagerProvider.notifier)\n          .setGlobalSetting<int>(SettingKeys.sleepTimerLastDurationMinutes, minutes);\n    } catch (e) {\n      logger('Failed to persist last sleep timer duration: $e', tag: 'SleepTimer', level: InfoLevel.warning);\n    }\n  }\n''',
              '''  Future<void> _persistLastDuration(Duration duration) async {\n    final minutes = duration.inMinutes < 1 ? 1 : duration.inMinutes;\n    try {\n      await ref\n          .read(settingsManagerProvider.notifier)\n          .setGlobalSetting<int>(SettingKeys.sleepTimerLastDurationMinutes, minutes);\n    } catch (e) {\n      logger('Failed to persist last sleep timer duration: $e', tag: 'SleepTimer', level: InfoLevel.warning);\n    }\n  }\n\n  Future<void> _persistLastMode(SleepTimerMode mode) async {\n    try {\n      await ref.read(settingsManagerProvider.notifier).setGlobalSetting<String>(SettingKeys.sleepTimerLastMode, mode.name);\n    } catch (e) {\n      logger('Failed to persist last sleep timer mode: $e', tag: 'SleepTimer', level: InfoLevel.warning);\n    }\n  }\n''',
              'persist last mode helper',
          )
          replace_between(
              sleep,
              '  bool get canReset {\n',
              '  Future<void> _tryAutoRestartSleepTimerOnPlaybackStart() async {\n',
              '''  bool get canReset => state.isActive && state.mode == SleepTimerMode.duration;\n\n''',
              'chapter reset availability',
          )
          replace_once(
              sleep,
              '''    final autoRestartSuppressed = settingManager.getGlobalSetting<bool>(SettingKeys.sleepTimerAutoRestartSuppressed);\n    if (autoRestartSuppressed) {\n      logger('Sleep timer auto-restart is suppressed after manual stop', tag: 'SleepTimer', level: InfoLevel.debug);\n      return;\n    }\n\n    if (!_isWithinAutoRestartTimeRange()) {\n''',
              '''    final autoRestartSuppressed = settingManager.getGlobalSetting<bool>(SettingKeys.sleepTimerAutoRestartSuppressed);\n    if (autoRestartSuppressed) {\n      logger('Sleep timer auto-restart is suppressed after manual stop', tag: 'SleepTimer', level: InfoLevel.debug);\n      return;\n    }\n\n    final lastMode = settingManager.getGlobalSetting<String>(\n      SettingKeys.sleepTimerLastMode,\n      defaultValue: SleepTimerMode.duration.name,\n    );\n    if (lastMode != SleepTimerMode.duration.name) {\n      logger('Sleep timer auto-restart skipped because the last timer mode was not duration', tag: 'SleepTimer', level: InfoLevel.debug);\n      return;\n    }\n\n    if (!_isWithinAutoRestartTimeRange()) {\n''',
              'mode-aware auto restart',
          )
          replace_once(
              sleep,
              '''    unawaited(_setAutoRestartSuppressed(false));\n    unawaited(_persistLastDuration(duration));\n\n    logger('Sleep timer started for ${duration.inMinutes} minutes', tag: 'SleepTimer', level: InfoLevel.info);\n''',
              '''    unawaited(_setAutoRestartSuppressed(false));\n    unawaited(_persistLastDuration(duration));\n    unawaited(_persistLastMode(SleepTimerMode.duration));\n\n    logger('Sleep timer started for ${duration.inMinutes} minutes', tag: 'SleepTimer', level: InfoLevel.info);\n''',
              'duration mode persistence',
          )
          replace_once(
              sleep,
              '''    // Chapter timers deliberately do not auto-restart in PR 1. Keeping the\n    // existing suppression bit set also prevents a stale duration from being\n    // revived after chapter expiry.\n    unawaited(_setAutoRestartSuppressed(true));\n\n    final marker = _createMarker();\n''',
              '''    // Chapter timers deliberately do not auto-restart in PR 1. Persist the\n    // mode separately so the manual-stop suppression bit keeps its original meaning.\n    unawaited(_setAutoRestartSuppressed(false));\n    unawaited(_persistLastMode(SleepTimerMode.chapterEnd));\n\n    final marker = _createMarker();\n''',
              'chapter mode persistence',
          )
          replace_once(
              sleep,
              '''    if (state.mode == SleepTimerMode.chapterEnd) {\n      return _extendChapterTimerByOneChapter();\n    }\n''',
              '''    if (state.mode == SleepTimerMode.chapterEnd) {\n      return false;\n    }\n''',
              'chapter reset no-op',
          )
          replace_between(
              sleep,
              '  bool _extendChapterTimerByOneChapter() {\n',
              '  void _startTimer(Duration duration) {\n',
              '',
              'remove next-chapter extension',
          )

          # Ensure no obsolete seek-discontinuity mechanism remains.
          sleep_text = Path(sleep).read_text()
          if '_chapterSeekSettleTimer' in sleep_text or 'PositionDiscontinuity' in sleep_text:
              raise SystemExit('obsolete chapter seek-discontinuity state remains')
          if 'resolveFollowingChapterSleepTarget' in sleep_text:
              raise SystemExit('out-of-scope next-chapter extension remains')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format touched Dart files
        run: |
          dart format \
            lib/util/audio_handler/bg_audio_handler.dart \
            lib/util/audio_handler/bg_audio_handler_models.dart \
            lib/util/audio_handler/bg_audio_handler_resume.dart \
            lib/util/handler/sleep_timer_handler.dart \
            lib/util/handler/sleep_timer_target.dart \
            lib/util/setting_key.dart \
            test/util/sleep_timer_target_test.dart

      - name: Check diff whitespace
        run: git diff --check

      - name: Analyze sources
        run: flutter analyze lib

      - name: Run chapter target tests
        run: flutter test test/util/sleep_timer_target_test.dart

      - name: Commit hardened implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/util/audio_handler/bg_audio_handler.dart \
            lib/util/audio_handler/bg_audio_handler_models.dart \
            lib/util/audio_handler/bg_audio_handler_resume.dart \
            lib/util/handler/sleep_timer_handler.dart \
            lib/util/handler/sleep_timer_target.dart \
            lib/util/setting_key.dart \
            test/util/sleep_timer_target_test.dart
          git commit -m "Harden chapter sleep timer navigation races"
          git push origin HEAD:feat/chapter-end-sleep-timer
