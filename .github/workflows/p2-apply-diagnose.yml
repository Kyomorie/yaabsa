name: P2 apply diagnose

on:
  push:
    branches:
      - automation/p2-progress-authority
    paths:
      - '.github/workflows/p2-apply-diagnose.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/p2-progress-authority
          fetch-depth: 0
      - name: Capture exact apply failure
        shell: bash
        run: |
          set +e
          python3 .github/scripts/apply-p2-progress-authority.py > /tmp/p2-apply.txt 2>&1
          code=$?
          set -e
          {
            echo "exit_code=$code"
            cat /tmp/p2-apply.txt
          } > .github/p2-apply-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/p2-apply-output.txt
          git commit -m "ci: capture P2 apply diagnostics"
          git push origin HEAD:automation/p2-progress-authority
