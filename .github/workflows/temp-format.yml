name: Temporary formatter

on:
  push:
    branches:
      - feat/chapter-end-sleep-timer

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/chapter-end-sleep-timer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format chapter sleep timer sources
        shell: bash
        run: |
          dart format \
            lib/util/handler/sleep_timer_handler.dart \
            lib/util/handler/sleep_timer_target.dart

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- \
            lib/util/handler/sleep_timer_handler.dart \
            lib/util/handler/sleep_timer_target.dart; then
            echo "No formatter changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/util/handler/sleep_timer_handler.dart \
            lib/util/handler/sleep_timer_target.dart
          git commit -m "Format chapter sleep timer sources"
          git push origin HEAD:feat/chapter-end-sleep-timer
