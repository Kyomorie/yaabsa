name: Temporary chapter sleep E2E bootstrap

on:
  push:
    branches:
      - ci/chapter-sleep-v4-runtime-smoke

permissions:
  contents: read
  actions: read

jobs:
  android-abs-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ABS_URL: http://127.0.0.1:13378
      ABS_ANDROID_URL: http://10.0.2.2:13378
      ABS_USER: root
      ABS_PASSWORD: e2e12345
    steps:
      - name: Download exact e04c0e1 Android APK artifact
        shell: bash
        run: |
          url='https://api.github.com/repos/Kyomorie/yaabsa/actions/artifacts/10436296620/zip'
          curl -fL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$url" -o android-artifact.zip
          rc=$?
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          mkdir -p android-artifact
          unzip -q android-artifact.zip -d android-artifact
          apk="$(find android-artifact -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ] || [ ! -f "$apk" ]; then echo 'No APK found'; exit 2; fi
          cp "$apk" yaabsa-auto-debug.apk
          sha256sum yaabsa-auto-debug.apk | tee apk.sha256

      - name: Create synthetic two-chapter audiobook
        shell: bash
        run: |
          sudo apt-get update >/dev/null
          rc=$?; if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          sudo apt-get install -y ffmpeg jq >/dev/null
          rc=$?; if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          mkdir -p runtime/abs/config runtime/abs/metadata 'runtime/abs/audiobooks/Chapter Test A'
          cat > chapters.ffmeta <<'META'
          ;FFMETADATA1
          title=Chapter Test A
          artist=Runtime Bot
          album=Chapter Test A
          [CHAPTER]
          TIMEBASE=1/1000
          START=0
          END=8000
          title=S1
          [CHAPTER]
          TIMEBASE=1/1000
          START=8000
          END=16000
          title=S2
          META
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=16:sample_rate=44100' -f ffmetadata -i chapters.ffmeta -map 0:a -map_metadata 1 -map_chapters 1 -c:a aac -b:a 96k -movflags +faststart 'runtime/abs/audiobooks/Chapter Test A/Chapter Test A.m4b'
          rc=$?; if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          ffprobe -v error -print_format json -show_format -show_chapters 'runtime/abs/audiobooks/Chapter Test A/Chapter Test A.m4b' > ffprobe.json
          chapter_count="$(jq '.chapters | length' ffprobe.json)"
          echo "synthetic chapters=$chapter_count duration=$(jq -r '.format.duration' ffprobe.json)"
          jq '.chapters[] | {id,start_time,end_time,tags}' ffprobe.json
          if [ "$chapter_count" -ne 2 ]; then exit 3; fi

      - name: Start and initialize isolated Audiobookshelf
        shell: bash
        run: |
          docker run -d --rm --name abs-e2e -p 13378:80 -v "$PWD/runtime/abs/config:/config" -v "$PWD/runtime/abs/metadata:/metadata" -v "$PWD/runtime/abs/audiobooks:/audiobooks" ghcr.io/advplyr/audiobookshelf:2.36.0 > abs-container-id.txt
          rc=$?; if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          ready=0; i=0
          while [ "$i" -lt 90 ]; do
            if curl -fsS "$ABS_URL/status" -o abs-status.json; then ready=1; break; fi
            sleep 2; i=$((i + 1))
          done
          if [ "$ready" -ne 1 ]; then docker logs abs-e2e > abs-server.log 2>&1 || true; exit 4; fi
          is_init="$(jq -r '.isInit' abs-status.json)"
          if [ "$is_init" != 'true' ]; then
            curl -fsS -X POST "$ABS_URL/init" -H 'Content-Type: application/json' -d "{\"newRoot\":{\"username\":\"$ABS_USER\",\"password\":\"$ABS_PASSWORD\"}}" -o abs-init.json
            rc=$?; if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          fi
          curl -fsS -X POST "$ABS_URL/login" -H 'Content-Type: application/json' -H 'x-return-tokens: true' -d "{\"username\":\"$ABS_USER\",\"password\":\"$ABS_PASSWORD\"}" -o abs-login.json
          rc=$?; if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          token="$(jq -r '.user.accessToken // .accessToken // .user.token // empty' abs-login.json)"
          if [ -z "$token" ]; then exit 5; fi
          echo "ABS_TOKEN=$token" >> "$GITHUB_ENV"
          curl -fsS -X POST "$ABS_URL/api/libraries" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"Runtime Books","folders":[{"fullPath":"/audiobooks"}],"mediaType":"book","provider":"google","settings":{"disableWatcher":true}}' -o abs-library.json
          rc=$?; if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          library_id="$(jq -r '.id // empty' abs-library.json)"; if [ -z "$library_id" ]; then exit 6; fi
          echo "ABS_LIBRARY_ID=$library_id" >> "$GITHUB_ENV"
          curl -fsS -X POST "$ABS_URL/api/libraries/$library_id/scan?force=1" -H "Authorization: Bearer $token" -o abs-scan.json
          rc=$?; if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          scanned=0; i=0
          while [ "$i" -lt 90 ]; do
            curl -fsS "$ABS_URL/api/libraries/$library_id/items?limit=0&minified=0" -H "Authorization: Bearer $token" -o abs-items.json || true
            total="$(jq -r '.total // 0' abs-items.json 2>/dev/null || echo 0)"
            num_chapters="$(jq -r '.results[0].media.numChapters // 0' abs-items.json 2>/dev/null || echo 0)"
            if [ "$total" -ge 1 ] && [ "$num_chapters" -ge 2 ]; then scanned=1; break; fi
            sleep 2; i=$((i + 1))
          done
          jq '{total, item: (.results[0] | {id,path,mediaType,media:{duration:.media.duration,numChapters:.media.numChapters,metadata:.media.metadata}})}' abs-items.json || true
          if [ "$scanned" -ne 1 ]; then exit 7; fi

      - name: Prepare Android 35 emulator
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | sort | tail -n 1)"
          if [ -z "$sdkmanager" ]; then exit 8; fi
          avdmanager="$(dirname "$sdkmanager")/avdmanager"
          image='system-images;android-35;google_apis;x86_64'
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" 'platform-tools' 'emulator' "$image" >/dev/null
          rc=$?; if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          emulator_bin="$sdk_root/emulator/emulator"
          if [ ! -x "$avdmanager" ] || [ ! -x "$emulator_bin" ]; then exit 9; fi
          avd_home="$RUNNER_TEMP/android-avd"; mkdir -p "$avd_home"; export ANDROID_AVD_HOME="$avd_home"
          echo no | "$avdmanager" create avd --force --name yaabsa-e2e --package "$image" --device pixel_7 >/dev/null
          rc=$?; if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if ! "$emulator_bin" -list-avds | grep -Fxq 'yaabsa-e2e'; then exit 10; fi
          echo "RUNTIME_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$avd_home" >> "$GITHUB_ENV"

      - name: Boot emulator and launch Yaabsa
        shell: bash
        run: |
          sdk_root="$RUNTIME_SDK_ROOT"; emulator_bin="$sdk_root/emulator/emulator"; adb_bin="$sdk_root/platform-tools/adb"
          "$adb_bin" kill-server >/dev/null 2>&1 || true; "$adb_bin" start-server >/dev/null
          rc=$?; if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; accel='on'; else accel='off'; fi
          "$emulator_bin" -avd yaabsa-e2e -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -accel "$accel" > emulator.log 2>&1 &
          emulator_pid=$!; echo "$emulator_pid" > emulator.pid
          device_seen=0; i=0
          while [ "$i" -lt 60 ]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat emulator.log; exit 11; fi
            if "$adb_bin" devices | awk 'NR>1 && $1 ~ /^emulator-/ && $2 == "device" {found=1} END {exit !found}'; then device_seen=1; break; fi
            sleep 2; i=$((i + 1))
          done
          if [ "$device_seen" -ne 1 ]; then exit 12; fi
          booted=0; i=0
          while [ "$i" -lt 90 ]; do
            state="$("$adb_bin" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$state" = '1' ]; then booted=1; break; fi
            sleep 2; i=$((i + 1))
          done
          if [ "$booted" -ne 1 ]; then exit 13; fi
          "$adb_bin" install -r yaabsa-auto-debug.apk >/dev/null
          rc=$?; if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          "$adb_bin" logcat -c
          "$adb_bin" shell am start -n de.vito0912.yaabsa.dev/de.vito0912.yaabsa.MainActivity | tee android-start.txt
          rc=${PIPESTATUS[0]}; if [ "$rc" -ne 0 ]; then exit "$rc"; fi

      - name: Drive Yaabsa login into isolated ABS from live UI bounds
        shell: bash
        run: |
          adb_bin="$RUNTIME_SDK_ROOT/platform-tools/adb"
          cat > ui_point.py <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          mode, key, path = sys.argv[1:4]
          nodes = list(ET.parse(path).getroot().iter('node'))
          if mode == 'edit':
              edits = [n for n in nodes if n.attrib.get('class') == 'android.widget.EditText']
              index = int(key)
              if index >= len(edits): raise SystemExit(f'EditText index {index} missing; found {len(edits)}')
              node = edits[index]
          elif mode == 'desc':
              matches = [n for n in nodes if n.attrib.get('content-desc') == key]
              if not matches: raise SystemExit(f'content-desc {key!r} missing')
              node = matches[0]
          else: raise SystemExit(2)
          nums = [int(x) for x in re.findall(r'-?\d+', node.attrib.get('bounds', ''))]
          if len(nums) != 4: raise SystemExit(3)
          print((nums[0] + nums[2]) // 2, (nums[1] + nums[3]) // 2)
          PY
          cat > ui_value.py <<'PY'
          import sys, xml.etree.ElementTree as ET
          index, path = int(sys.argv[1]), sys.argv[2]
          edits = [n for n in ET.parse(path).getroot().iter('node') if n.attrib.get('class') == 'android.widget.EditText']
          if index >= len(edits): raise SystemExit(2)
          print(edits[index].attrib.get('text', ''))
          PY
          dump_ui() {
            out="$1"
            "$adb_bin" shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1
            rc=$?; if [ "$rc" -ne 0 ]; then return "$rc"; fi
            "$adb_bin" exec-out cat /sdcard/window.xml > "$out"
          }
          count_edits() {
            python3 - "$1" <<'PY'
          import sys, xml.etree.ElementTree as ET
          print(sum(1 for n in ET.parse(sys.argv[1]).getroot().iter('node') if n.attrib.get('class') == 'android.widget.EditText'))
          PY
          }

          login_ready=0; i=0
          while [ "$i" -lt 30 ]; do
            dump_ui ui-current.xml || true
            edits="$(count_edits ui-current.xml 2>/dev/null || echo 0)"
            if [ "$edits" -ge 3 ] && grep -q 'Sign In' ui-current.xml; then login_ready=1; break; fi
            sleep 2; i=$((i + 1))
          done
          "$adb_bin" exec-out screencap -p > before-login.png
          cp ui-current.xml before-login.xml 2>/dev/null || true
          if [ "$login_ready" -ne 1 ]; then
            echo 'Login UI semantics did not become ready within 60 seconds'
            exit 15
          fi
          echo "login semantics ready with $(count_edits ui-current.xml) EditTexts"

          tap_edit() {
            index="$1"; dump_ui ui-current.xml
            coords="$(python3 ui_point.py edit "$index" ui-current.xml)"; rc=$?
            if [ "$rc" -ne 0 ]; then exit 17; fi
            "$adb_bin" shell input tap $coords; sleep 1
          }
          tap_edit 0
          "$adb_bin" shell input text 'h'; sleep 1; "$adb_bin" shell input text 'ttp://10.0.2.2:13378'; sleep 1
          dump_ui ui-after-server.xml
          server_value="$(python3 ui_value.py 0 ui-after-server.xml)"; echo "server field=$server_value"
          if [ "$server_value" != "$ABS_ANDROID_URL" ]; then exit 18; fi
          tap_edit 1
          "$adb_bin" shell input text "$ABS_USER"; sleep 1; dump_ui ui-after-user.xml
          user_value="$(python3 ui_value.py 1 ui-after-user.xml)"; echo "user field=$user_value"
          if [ "$user_value" != "$ABS_USER" ]; then exit 19; fi
          tap_edit 2
          "$adb_bin" shell input text "$ABS_PASSWORD"; sleep 1; "$adb_bin" shell input keyevent 4; sleep 1
          dump_ui ui-before-submit.xml
          coords="$(python3 ui_point.py desc 'Sign In' ui-before-submit.xml)"; rc=$?; if [ "$rc" -ne 0 ]; then exit 20; fi
          "$adb_bin" shell input tap $coords

          logged_in=0; i=0
          while [ "$i" -lt 30 ]; do
            sleep 2; dump_ui after-login.xml || true
            if grep -E -q 'Chapter Test A|Bookshelf|Library|Home' after-login.xml && ! grep -q 'Sign in to your Audiobookshelf server' after-login.xml; then logged_in=1; break; fi
            i=$((i + 1))
          done
          "$adb_bin" exec-out screencap -p > after-login.png
          "$adb_bin" logcat -d > android-e2e.log
          "$adb_bin" shell dumpsys activity activities > android-activities.txt
          echo '--- visible UI after login attempt ---'
          grep -oE 'text="[^"]*"|content-desc="[^"]*"' after-login.xml | head -n 160 || true
          if grep -q 'FATAL EXCEPTION' android-e2e.log; then exit 21; fi
          if [ "$logged_in" -ne 1 ]; then exit 22; fi

      - name: Upload E2E bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chapter-sleep-e2e-bootstrap-evidence
          path: |
            apk.sha256
            ffprobe.json
            abs-status.json
            abs-init.json
            abs-library.json
            abs-scan.json
            abs-items.json
            abs-server.log
            before-login.png
            before-login.xml
            ui-current.xml
            ui-after-server.xml
            ui-after-user.xml
            ui-before-submit.xml
            after-login.png
            after-login.xml
            android-start.txt
            android-e2e.log
            android-activities.txt
            emulator.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          adb_bin="${RUNTIME_SDK_ROOT:-${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}}/platform-tools/adb"
          if [ -x "$adb_bin" ]; then "$adb_bin" emu kill >/dev/null 2>&1 || true; fi
          docker rm -f abs-e2e >/dev/null 2>&1 || true
