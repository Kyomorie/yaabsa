name: P1 format output

on:
  push:
    branches:
      - automation/p1-format-output

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        shell: bash
        run: flutter pub get

      - name: Format exact file
        shell: bash
        run: dart format lib/util/audio_handler/bg_audio_handler_preferences.dart

      - name: Enforce exact scope
        shell: bash
        run: |
          git checkout -- pubspec.lock
          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo "Already formatted; nothing to commit."
            exit 0
          fi
          if [[ "$changed" != "lib/util/audio_handler/bg_audio_handler_preferences.dart" ]]; then
            echo "Unexpected changed paths:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit exact format result
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/util/audio_handler/bg_audio_handler_preferences.dart
          git commit -m "style: format playback preferences with resolved SDK"
          git push origin HEAD:automation/p1-format-output
