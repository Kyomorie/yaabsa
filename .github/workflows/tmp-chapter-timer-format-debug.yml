name: Temporary chapter timer format debug

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

jobs:
  format-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format merged resume file
        run: dart format lib/util/audio_handler/bg_audio_handler_resume.dart
      - name: Commit formatter result if needed
        shell: bash
        run: |
          if git diff --quiet -- lib/util/audio_handler/bg_audio_handler_resume.dart; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/util/audio_handler/bg_audio_handler_resume.dart
          git commit -m "style: format merged resume file"
          git push origin HEAD:feat/chapter-end-sleep-timer-upstream
