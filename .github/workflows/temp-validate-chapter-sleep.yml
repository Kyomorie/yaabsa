name: Temporary chapter sleep validation

on:
  push:
    branches:
      - feat/chapter-end-sleep-timer

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/chapter-end-sleep-timer
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run chapter sleep target tests
        run: flutter test test/util/sleep_timer_target_test.dart
