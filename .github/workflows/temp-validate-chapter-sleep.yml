name: Temporary chapter sleep validation

on:
  push:
    branches:
      - feat/chapter-end-sleep-timer

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/chapter-end-sleep-timer
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        shell: bash
        run: flutter pub get

      - name: Check formatting of changed Dart sources
        shell: bash
        run: |
          dart format --set-exit-if-changed \
            lib/components/player/common/sleep_timer_button.dart \
            lib/screens/settings/player/widgets/shake_settings_section.dart \
            lib/util/audio_handler/bg_audio_handler.dart \
            lib/util/audio_handler/bg_audio_handler_state.dart \
            lib/util/handler/shake_handler.dart \
            lib/util/handler/sleep_timer_handler.dart \
            lib/util/handler/sleep_timer_handler.g.dart \
            lib/util/handler/sleep_timer_target.dart \
            test/util/sleep_timer_target_test.dart

      - name: Verify sleep timer generated provider
        shell: bash
        run: |
          dart run build_runner build --build-filter=lib/util/handler/sleep_timer_handler.g.dart
          git diff --exit-code -- lib/util/handler/sleep_timer_handler.g.dart

      - name: Analyze sources
        shell: bash
        run: flutter analyze lib

      - name: Run chapter sleep target tests
        shell: bash
        run: flutter test test/util/sleep_timer_target_test.dart
